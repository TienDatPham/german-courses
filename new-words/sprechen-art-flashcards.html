<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neue Wörter Karteikarten</title>
<style>
:root{--bg:#fafaf8;--ink:#222;--soft:#666;--card:#fff;--line:#ddd;--ok:#2e7d32;--no:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--ink:#eee;--soft:#aaa;--card:#222;--line:#444;--ok:#66bb6a;--no:#ef5350}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
main{width:100%;max-width:640px}
main.tv{max-width:1200px}
main.tv .cardonly{display:none}
.bar{display:flex;justify-content:space-between;color:var(--soft);font-size:14px;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:280px;padding:24px;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.front{font-size:34px;font-weight:600;text-align:center}
.back p{margin:0 0 12px}.lab{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);display:block}
.hint{text-align:center;color:var(--soft);font-size:13px;margin-top:8px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{flex:1;padding:10px 14px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
button.ok{border-color:var(--ok);color:var(--ok)}button.no{border-color:var(--no);color:var(--no)}
.scroll{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--card)}td.chk{text-align:center}
</style></head><body><main id="main">
<div class="bar"><span id="pos"></span><span id="stat"></span><label class="cardonly"><input type="checkbox" id="rev"> <span id="revlab"></span></label></div>
<div class="card cardonly" id="card"></div>
<div class="hint cardonly">↓ oder Leertaste: umdrehen · → Gewusst · ← Noch nicht · ↑ Alle Wörter</div>
<div class="row cardonly"><button class="no" id="no">Noch nicht</button><button class="ok" id="ok">Gewusst</button></div>
<div class="row"><button id="all">Alle Wörter</button><button id="reset">Zurücksetzen</button></div>
<div class="scroll" id="tbl" hidden></div>
</main>
<script>
const D={"head":["Worter","Definition","Beispiel","Note"],"labels":["Definition","Beispiel","Note"],"cards":[{"f":"überzeugen","b":["Jemanden durch Argumente oder Beweise dazu bringen, etwas zu glauben oder zu tun.","Sie überzeugte ihren Chef von ihrem Plan.","Der Akkusativ steht für die Person; `von` + Dativ steht für die Sache. Perfekt: hat überzeugt. Reflexiv: sich überzeugen = sich selbst Gewissheit verschaffen."]},{"f":"auffordern","b":["Jemanden nachdrücklich bitten oder verpflichten, etwas zu tun.","Der Lehrer forderte die Schüler auf, leise zu sein.","`jdn. zu etw. auffordern`. Trennbar: fordert auf. Stärker als \"bitten\"."]},{"f":"beschließen","b":["Nach Überlegung entscheiden, etwas zu tun.","Der Gemeinderat beschloss, einen neuen Spielplatz zu bauen.","Schweizer Schreibweise: beschliessen. In Deutschland: beschließen. Perfekt: hat beschlossen."]},{"f":"flüstern","b":["Sehr leise sprechen, fast ohne Stimme.","Sie flüsterte ihm das Geheimnis ins Ohr.","Perfekt: hat geflüstert."]},{"f":"tuscheln","b":["Heimlich und leise mit jemandem reden, oft über andere.","Die Schülerinnen tuschelten während des Unterrichts.","Oft etwas abwertend."]},{"f":"jammern","b":["Sich laut und klagend über etwas beschweren oder sein Leid ausdrücken.","Er jammert ständig über das Wetter.","Abwertend. `über` + Akkusativ oder `um` + Akkusativ (jammern um jdn.)."]},{"f":"nuscheln","b":["Undeutlich und leise sprechen, sodass man es schwer versteht.","Der Schauspieler nuschelt so, dass man ihn kaum versteht.","Umgangssprachlich. Man spricht von \"Nuschler\"."]},{"f":"seufzen","b":["Hörbar tief ausatmen, meist aus Kummer, Erleichterung oder Müdigkeit.","Sie seufzte erleichtert, als die Prüfung vorbei war.","Auch als Nomen: der Seufzer."]},{"f":"einsagen","b":["Jemandem heimlich die richtige Antwort zuflüstern, besonders in der Schule.","Er sagte seinem Nachbarn die Lösung ein.","Trennbar: sagt ein. Süddeutsch/österreichisch; in Norddeutschland oft \"vorsagen\" oder \"soufflieren\". Noch prüfen."]},{"f":"ächzen","b":["Mit einem Laut des Schmerzes oder der Anstrengung stöhnen; auch von Holz gesagt, das knarrt.","Der Mann ächzte unter dem schweren Rucksack.","Perfekt: hat geächzt. Auch bildlich: Das Gebälk ächzt."]},{"f":"raunen","b":["Leise und geheimnisvoll sprechen oder sagen.","Die Leute raunten, der Bürgermeister trete zurück.","Eher literarisch. Auch als Nomen: das Raunen (der Menge)."]},{"f":"Zaun","b":["Eine Begrenzung aus Holz, Draht oder Metall um ein Grundstück.","Der Zaun um den Garten ist frisch gestrichen.","Nomen, maskulin: der Zaun, die Zäune. Redewendung: einen Streit vom Zaun brechen = ihn mutwillig beginnen."]},{"f":"plaudern","b":["Gemütlich und ungezwungen über unwichtige Dinge reden.","Wir plauderten stundenlang bei einer Tasse Kaffee.","Positiv und freundlich. Verwandt: die Plauderei. Bildlich: aus dem Nähkästchen plaudern = Geheimnisse verraten."]},{"f":"quasseln","b":["Viel und oft sinnlos reden.","Er quasselt den ganzen Tag, ohne etwas zu sagen.","Umgangssprachlich und abwertend."]},{"f":"petzen","b":["Etwas Verbotenes über jemanden an Lehrer oder Eltern verraten.","Sie hat dem Lehrer gepetzt, dass wir abgeschrieben haben.","Umgangssprachlich, oft in der Kindersprache. Der Petzer = jemand, der petzt."]},{"f":"stottern","b":["Beim Sprechen Laute oder Silben wiederholen oder stocken.","Er stottert, wenn er aufgeregt ist.","Perfekt: hat gestottert. Auch bildlich: Der Motor stottert."]},{"f":"lispeln","b":["Beim Sprechen das \"s\" falsch aussprechen, nämlich mit der Zunge an den Zähnen.","Das Kind lispelt und sagt \"Thonne\" statt \"Sonne\".","Perfekt: hat gelispelt. Aussprachefehler, kein Charakterzug."]},{"f":"prahlen","b":["Mit eigenen Leistungen oder Besitz laut angeben.","Er prahlt gern mit seinem neuen Auto.","Abwertend. `mit` + Dativ. Ähnlich: angeben, protzen, sich brüsten."]},{"f":"vortragen","b":["Etwas vor Zuhörern mündlich darbieten, zum Beispiel ein Gedicht oder ein Referat.","Die Studentin trug ihre Ergebnisse vor.","Trennbar: trägt vor. Auch: ein Anliegen vortragen = jemandem sagen."]},{"f":"nörgeln","b":["Ständig an Kleinigkeiten etwas auszusetzen haben.","Er nörgelt immer am Essen herum.","Abwertend. `an` + Dativ. Der Nörgler."]},{"f":"lästern","b":["Boshaft oder abwertend über Abwesende reden.","Die Kollegen lästerten über den neuen Chef.","Umgangssprachlich. `über` + Akkusativ. Älter und religiös: Gott lästern = Gott beleidigen."]},{"f":"meckern","b":["Sich ständig unzufrieden über etwas äußern.","Er meckert immer über das Essen in der Kantine.","Umgangssprachlich, abwertend. `über` + Akkusativ. Perfekt: hat gemeckert. Auch: die Ziege meckert. Ähnlich: nörgeln, motzen."]},{"f":"motzen","b":["Ärgerlich und laut über etwas schimpfen.","Der Kunde motzte, weil der Zug wieder Verspätung hatte.","Umgangssprachlich. `über` + Akkusativ oder `an` + Dativ. Perfekt: hat gemotzt. Lauter und aggressiver als meckern."]},{"f":"tratschen","b":["Über andere Leute und ihr Privatleben reden, oft mit Neugier oder Bosheit.","Die Nachbarinnen tratschen gern über alle im Haus.","Umgangssprachlich, abwertend. `über` + Akkusativ. Perfekt: hat getratscht. Die Tratscherei, der Tratsch. Ähnlich: klatschen, lästern. Besonders süddeutsch und österreichisch; im Norden eher \"klönen\" oder \"klatschen\". Noch prüfen."]},{"f":"ermahnen","b":["Jemanden mit Nachdruck auf sein Verhalten hinweisen und zu etwas auffordern.","Die Lehrerin ermahnte die Klasse, pünktlich zu sein.","Der Akkusativ steht für die Person; `zu` + Dativ steht für die Sache (jdn. zur Ruhe ermahnen). Perfekt: hat ermahnt. Nomen: die Ermahnung. Formeller als warnen."]},{"f":"schimpfen","b":["Ärgerlich und laut sagen, dass man etwas schlecht findet, oder Schimpfwörter benutzen.","Der Vater schimpfte, weil das Kind wieder zu spät nach Hause kam.","`über` + Akkusativ (über das Wetter schimpfen), `mit` + Dativ (mit dem Kind schimpfen = es ausschimpfen), `auf` + Akkusativ. Perfekt: hat geschimpft. Auch: Schimpfwörter sagen. Nomen: das Schimpfwort."]},{"f":"kreischen","b":["Mit hoher, lauter und unangenehmer Stimme schreien.","Die Kinder kreischten vor Vergnügen im Schwimmbad.","Perfekt: hat gekreischt. Auch von Geräuschen: Die Bremsen kreischen. Meist hohe Töne, oft aus Angst oder Aufregung."]},{"f":"grölen","b":["Laut und ungehobelt singen oder schreien, oft betrunken.","Die Fans grölten auf dem Heimweg vom Stadion.","Umgangssprachlich, abwertend. Perfekt: hat gegrölt."]},{"f":"stöhnen","b":["Bei Schmerz, Anstrengung oder Lust einen tiefen Laut ausstoßen oder klagend seufzen.","Er stöhnte, als er den schweren Koffer die Treppe hochtrug.","Perfekt: hat gestöhnt. `über` + Akkusativ (über die viele Arbeit stöhnen = klagen). Nomen: das Stöhnen. Ähnlich: ächzen."]},{"f":"quengeln","b":["Als Kind weinerlich und ausdauernd etwas verlangen oder sich beschweren.","Das Kind quengelt an der Supermarktkasse, bis es ein Eis bekommt.","Umgangssprachlich. Perfekt: hat gequengelt. Oft bei müden oder unzufriedenen Kindern. Adjektiv: quengelig."]},{"f":"befehlen","b":["Jemandem mit Autorität sagen, dass er etwas tun muss.","Der Offizier befahl den Soldaten, sich zurückzuziehen.","Dativ für die Person: jdm. etw. befehlen. Perfekt: hat befohlen. Unregelmäßig: befiehlt, befahl, befohlen. Nomen: der Befehl. Ähnlich: anordnen, anweisen."]},{"f":"brüllen","b":["Sehr laut schreien, mit tiefer und kräftiger Stimme.","Der Trainer brüllte seine Anweisungen über das ganze Spielfeld.","Perfekt: hat gebrüllt. Auch von Tieren (der Löwe brüllt). Redewendung: vor Lachen brüllen. Lauter und kräftiger als rufen."]},{"f":"jubeln","b":["Laut und voller Freude schreien.","Die Zuschauer jubelten, als die Mannschaft das Tor schoss.","Perfekt: hat gejubelt. Nomen: der Jubel. Oft: jubeln über + Akkusativ oder jdm. zujubeln."]}],"key":"fc-known-new-words"},ALL=D.cards,LAB=D.labels;
let cur=-1,flip=false,known={},table=false;
try{known=JSON.parse(localStorage.getItem(D.key)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(D.key,JSON.stringify(known))}catch(e){}};
const el=(id)=>document.getElementById(id);
const esc=(s)=>s.replace(/[&<>]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/`([^`]+)`/g,'<b>$1</b>');
const unknown=()=>ALL.map((_,k)=>k).filter((k)=>!known[ALL[k].f]);
el('revlab').textContent=LAB[0]+' zuerst';
const HR='<hr style="width:100%;border:0;border-top:1px solid var(--line);margin:16px 0">';
function stats(){
  el('pos').textContent='Unbekannt: '+unknown().length+'/'+ALL.length;
  el('stat').textContent='Gewusst: '+(ALL.length-unknown().length)+'/'+ALL.length;
}
function drawTable(){
  const th=D.head.concat(['Bekannt']).map((h)=>'<th>'+esc(h)+'</th>').join('');
  const body=ALL.map((c,k)=>'<tr>'+[c.f].concat(c.b).map((t)=>'<td>'+esc(t)+'</td>').join('')+'<td class="chk"><input type="checkbox" data-i="'+k+'"'+(known[c.f]?' checked':'')+' aria-label="Bekannt"></td></tr>').join('');
  el('tbl').innerHTML='<table><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table>';
}
function draw(){
  stats();
  if(table)return;
  if(cur<0){el('card').innerHTML='<div class="front">'+(ALL.length&&!unknown().length?'Alle Wörter gewusst':'Keine Karten')+'</div>';return}
  const c=ALL[cur],rev=el('rev').checked;
  const front='<div class="front">'+esc(c.f)+'</div>';
  const back='<div class="back">'+c.b.map((t,k)=>t?'<p><span class="lab">'+esc(LAB[k])+'</span>'+esc(t)+'</p>':'').join('')+'</div>';
  const alt='<div class="front" style="font-size:22px;font-weight:500">'+esc(c.b[0])+'</div>';
  el('card').innerHTML=flip?front+HR+back:(rev?alt:front);
}
function pick(){
  const u=unknown();
  if(!u.length)return -1;
  const o=u.filter((k)=>k!==cur),p=o.length?o:u;
  return p[Math.floor(Math.random()*p.length)];
}
function next(){cur=pick();flip=false;draw()}
function mark(v){if(cur<0)return;known[ALL[cur].f]=v;save();next()}
function showTable(on){
  table=on;
  el('main').classList.toggle('tv',on);
  el('tbl').hidden=!on;
  el('all').textContent=on?'Karten':'Alle Wörter';
  if(on)drawTable();
  if(!on&&(cur<0||known[ALL[cur].f])&&unknown().length)next();
  else draw();
}
el('card').onclick=()=>{if(cur>=0){flip=!flip;draw()}};
el('rev').onchange=()=>{flip=false;draw()};
el('ok').onclick=()=>mark(true);
el('no').onclick=()=>mark(false);
el('all').onclick=()=>showTable(!table);
el('reset').onclick=()=>{known={};save();cur=-1;if(table)drawTable();if(!table)next();else stats()};
el('tbl').onchange=(e)=>{const i=e.target.dataset&&e.target.dataset.i;if(i===undefined)return;known[ALL[i].f]=e.target.checked;save();stats()};
document.onkeydown=(e)=>{
  if(e.key==='ArrowUp'){e.preventDefault();showTable(!table);return}
  if(table)return;
  if(e.key===' '||e.key==='ArrowDown'){e.preventDefault();if(cur>=0){flip=!flip;draw()}}
  else if(e.key==='ArrowRight'){e.preventDefault();mark(true)}
  else if(e.key==='ArrowLeft'){e.preventDefault();mark(false)}
};
next();
</script></body></html>
