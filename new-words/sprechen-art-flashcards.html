<script>const D={"head":["Worter","Definition","Beispiel","Note"],"labels":["Definition","Beispiel","Note"],"cards":[{"f":"flüstern","b":["Sehr leise sprechen, fast ohne Stimme.","Sie flüsterte ihm das Geheimnis ins Ohr.","Verb · – · Perf. hat geflüstert · Rektion: jdm. etw. flüstern"]},{"f":"tuscheln","b":["Heimlich und leise mit jemandem reden, oft über andere.","Die Schülerinnen tuschelten während des Unterrichts.","Verb · – · Perf. hat getuschelt · Rektion: mit jdm. (über etw.) tuscheln · Hinweis: oft etwas abwertend"]},{"f":"jammern","b":["Sich laut und klagend über etwas beschweren oder sein Leid ausdrücken.","Er jammert ständig über das Wetter.","Verb · – · Perf. hat gejammert · Rektion: über + Akk.; um + Akk. (jammern um jdn.) · Hinweis: abwertend"]},{"f":"nuscheln","b":["Undeutlich und leise sprechen, sodass man es schwer versteht.","Der Schauspieler nuschelt so, dass man ihn kaum versteht.","Verb · – · Perf. hat genuschelt · Rektion: – · Hinweis: umgangssprachlich; man spricht von \"Nuschler\""]},{"f":"seufzen","b":["Hörbar tief ausatmen, meist aus Kummer, Erleichterung oder Müdigkeit.","Sie seufzte erleichtert, als die Prüfung vorbei war.","Verb · – · Perf. hat geseufzt · Rektion: – · Hinweis: auch als Nomen: der Seufzer"]},{"f":"einsagen","b":["Jemandem heimlich die richtige Antwort zuflüstern, besonders in der Schule.","Er sagte seinem Nachbarn die Lösung ein.","Verb · trennbar (sagt ein) · Perf. hat eingesagt · Rektion: jdm. etw. einsagen · Hinweis: süddeutsch/österreichisch; in Norddeutschland oft \"vorsagen\" oder \"soufflieren\"; Noch prüfen"]},{"f":"ächzen","b":["Mit einem Laut des Schmerzes oder der Anstrengung stöhnen; auch von Holz gesagt, das knarrt.","Der Mann ächzte unter dem schweren Rucksack.","Verb · – · Perf. hat geächzt · Rektion: – · Hinweis: auch bildlich: Das Gebälk ächzt"]},{"f":"raunen","b":["Leise und geheimnisvoll sprechen oder sagen.","Die Leute raunten, der Bürgermeister trete zurück.","Verb · – · Perf. hat geraunt · Rektion: – · Hinweis: eher literarisch; auch als Nomen: das Raunen (der Menge)"]},{"f":"plaudern","b":["Gemütlich und ungezwungen über unwichtige Dinge reden.","Wir plauderten stundenlang bei einer Tasse Kaffee.","Verb · – · Perf. hat geplaudert · Rektion: mit jdm. (über etw.) plaudern · Hinweis: positiv und freundlich; verwandt: die Plauderei; bildlich: aus dem Nähkästchen plaudern = Geheimnisse verraten"]},{"f":"quasseln","b":["Viel und oft sinnlos reden.","Er quasselt den ganzen Tag, ohne etwas zu sagen.","Verb · – · Perf. hat gequasselt · Rektion: – · Hinweis: umgangssprachlich und abwertend"]},{"f":"petzen","b":["Etwas Verbotenes über jemanden an Lehrer oder Eltern verraten.","Sie hat dem Lehrer gepetzt, dass wir abgeschrieben haben.","Verb · – · Perf. hat gepetzt · Rektion: jdm. etw. petzen · Hinweis: umgangssprachlich, oft in der Kindersprache; der Petzer = jemand, der petzt"]},{"f":"stottern","b":["Beim Sprechen Laute oder Silben wiederholen oder stocken.","Er stottert, wenn er aufgeregt ist.","Verb · – · Perf. hat gestottert · Rektion: – · Hinweis: auch bildlich: Der Motor stottert"]},{"f":"lispeln","b":["Beim Sprechen das \"s\" falsch aussprechen, nämlich mit der Zunge an den Zähnen.","Das Kind lispelt und sagt \"Thonne\" statt \"Sonne\".","Verb · – · Perf. hat gelispelt · Rektion: – · Hinweis: Aussprachefehler, kein Charakterzug"]},{"f":"prahlen","b":["Mit eigenen Leistungen oder Besitz laut angeben.","Er prahlt gern mit seinem neuen Auto.","Verb · – · Perf. hat geprahlt · Rektion: mit + Dat. · Hinweis: abwertend; ähnlich: angeben, protzen, sich brüsten"]},{"f":"vortragen","b":["Etwas vor Zuhörern mündlich darbieten, zum Beispiel ein Gedicht oder ein Referat.","Die Studentin trug ihre Ergebnisse vor.","Verb · trennbar (trägt vor) · unregelmäßig: Prät. trug vor · Perf. hat vorgetragen · Rektion: (jdm.) etw. vortragen · Hinweis: auch: ein Anliegen vortragen = jemandem sagen"]},{"f":"nörgeln","b":["Ständig an Kleinigkeiten etwas auszusetzen haben.","Er nörgelt immer am Essen herum.","Verb · – · Perf. hat genörgelt · Rektion: an + Dat. · Hinweis: abwertend; der Nörgler"]},{"f":"lästern","b":["Boshaft oder abwertend über Abwesende reden.","Die Kollegen lästerten über den neuen Chef.","Verb · – · Perf. hat gelästert · Rektion: über + Akk. · Hinweis: umgangssprachlich; älter und religiös: Gott lästern = Gott beleidigen"]},{"f":"meckern","b":["Sich ständig unzufrieden über etwas äußern.","Er meckert immer über das Essen in der Kantine.","Verb · – · Perf. hat gemeckert · Rektion: über + Akk. · Hinweis: umgangssprachlich, abwertend; auch: die Ziege meckert; ähnlich: nörgeln, motzen"]},{"f":"motzen","b":["Ärgerlich und laut über etwas schimpfen.","Der Kunde motzte, weil der Zug wieder Verspätung hatte.","Verb · – · Perf. hat gemotzt · Rektion: über + Akk. oder an + Dat. · Hinweis: umgangssprachlich; lauter und aggressiver als meckern"]},{"f":"tratschen","b":["Über andere Leute und ihr Privatleben reden, oft mit Neugier oder Bosheit.","Die Nachbarinnen tratschen gern über alle im Haus.","Verb · – · Perf. hat getratscht · Rektion: über + Akk. · Hinweis: umgangssprachlich, abwertend; die Tratscherei, der Tratsch; ähnlich: klatschen, lästern; besonders süddeutsch und österreichisch; im Norden eher \"klönen\" oder \"klatschen\"; Noch prüfen"]},{"f":"ermahnen","b":["Jemanden mit Nachdruck auf sein Verhalten hinweisen und zu etwas auffordern.","Die Lehrerin ermahnte die Klasse, pünktlich zu sein.","Verb · untrennbar · Perf. hat ermahnt · Rektion: jdn. zu etw. ermahnen (Akkusativ für die Person; `zu` + Dativ für die Sache: jdn. zur Ruhe ermahnen) · Hinweis: Nomen: die Ermahnung; formeller als warnen"]},{"f":"schimpfen","b":["Ärgerlich und laut sagen, dass man etwas schlecht findet, oder Schimpfwörter benutzen.","Der Vater schimpfte, weil das Kind wieder zu spät nach Hause kam.","Verb · – · Perf. hat geschimpft · Rektion: über + Akk. (über das Wetter schimpfen); mit + Dat. (mit dem Kind schimpfen = es ausschimpfen); auf + Akk. · Hinweis: auch: Schimpfwörter sagen; Nomen: das Schimpfwort"]},{"f":"kreischen","b":["Mit hoher, lauter und unangenehmer Stimme schreien.","Die Kinder kreischten vor Vergnügen im Schwimmbad.","Verb · – · Perf. hat gekreischt · Rektion: – · Hinweis: auch von Geräuschen: Die Bremsen kreischen; meist hohe Töne, oft aus Angst oder Aufregung"]},{"f":"grölen","b":["Laut und ungehobelt singen oder schreien, oft betrunken.","Die Fans grölten auf dem Heimweg vom Stadion.","Verb · – · Perf. hat gegrölt · Rektion: – · Hinweis: umgangssprachlich, abwertend"]},{"f":"stöhnen","b":["Bei Schmerz, Anstrengung oder Lust einen tiefen Laut ausstoßen oder klagend seufzen.","Er stöhnte, als er den schweren Koffer die Treppe hochtrug.","Verb · – · Perf. hat gestöhnt · Rektion: über + Akk. (über die viele Arbeit stöhnen = klagen) · Hinweis: Nomen: das Stöhnen; ähnlich: ächzen"]},{"f":"quengeln","b":["Als Kind weinerlich und ausdauernd etwas verlangen oder sich beschweren.","Das Kind quengelt an der Supermarktkasse, bis es ein Eis bekommt.","Verb · – · Perf. hat gequengelt · Rektion: – · Hinweis: umgangssprachlich; oft bei müden oder unzufriedenen Kindern; Adjektiv: quengelig"]},{"f":"befehlen","b":["Jemandem mit Autorität sagen, dass er etwas tun muss.","Der Offizier befahl den Soldaten, sich zurückzuziehen.","Verb · untrennbar · unregelmäßig: Prät. befahl · Perf. hat befohlen · Rektion: jdm. etw. befehlen (Dativ für die Person) · Hinweis: du/er befiehlt; Nomen: der Befehl; ähnlich: anordnen, anweisen"]},{"f":"brüllen","b":["Sehr laut schreien, mit tiefer und kräftiger Stimme.","Der Trainer brüllte seine Anweisungen über das ganze Spielfeld.","Verb · – · Perf. hat gebrüllt · Rektion: – · Hinweis: auch von Tieren (der Löwe brüllt); Redewendung: vor Lachen brüllen; lauter und kräftiger als rufen"]},{"f":"jubeln","b":["Laut und voller Freude schreien.","Die Zuschauer jubelten, als die Mannschaft das Tor schoss.","Verb · – · Perf. hat gejubelt · Rektion: über + Akk.; jdm. zujubeln · Hinweis: Nomen: der Jubel"]}],"key":"fc-known-sprechen-art"};</script>
