<script>const D={"head":["Worter","Definition","Beispiel","Note"],"labels":["Definition","Beispiel","Note"],"cards":[{"f":"überzeugen","b":["Jemanden durch Argumente oder Beweise dazu bringen, etwas zu glauben oder zu tun.","Sie überzeugte ihren Chef von ihrem Plan.","Verb · untrennbar · Perf. hat überzeugt · Rektion: jdn. von etw. überzeugen (Akkusativ für die Person; `von` + Dativ für die Sache) · Hinweis: reflexiv: sich überzeugen = sich selbst Gewissheit verschaffen"]},{"f":"auffordern","b":["Jemanden nachdrücklich bitten oder verpflichten, etwas zu tun.","Der Lehrer forderte die Schüler auf, leise zu sein.","Verb · trennbar (fordert auf) · Perf. hat aufgefordert · Rektion: jdn. zu etw. auffordern · Hinweis: stärker als \"bitten\""]},{"f":"beschließen","b":["Als Gruppe oder Behörde offiziell entscheiden, etwas zu tun; auch: etwas als Ergebnis des Nachdenkens festlegen.","Der Stadtrat hat beschlossen, eine neue Brücke zu bauen.","Verb · untrennbar · unregelmäßig: Prät. beschloss · Perf. hat beschlossen · Rektion: etw. (Akk.) beschließen; nicht reflexiv · Hinweis: meist formelle oder gemeinsame Entscheidung (Rat, Gericht, Vorstand): einen Beschluss fassen; Unterschied zu `sich entschließen`: beschließen = offizielle Entscheidung, entschließen = persönliche Entscheidung; Schweizer Schreibweise: beschliessen"]},{"f":"Zaun","b":["Eine Begrenzung aus Holz, Draht oder Metall um ein Grundstück.","Der Zaun um den Garten ist frisch gestrichen.","Nomen · der · Pl. die Zäune · Hinweis: Redewendung: einen Streit vom Zaun brechen = ihn mutwillig beginnen"]},{"f":"begeistern","b":["Bei jemandem große Freude und Interesse für etwas wecken.","Die Rede des Trainers begeisterte das ganze Team.","Verb · untrennbar · Perf. hat begeistert · Rektion: jdn. für etw. begeistern; reflexiv: sich für etw. begeistern · Hinweis: Adjektiv: begeistert (von/über)"]},{"f":"schrecklich","b":["Sehr schlimm, furchtbar oder Angst auslösend.","Der Unfall war schrecklich, zum Glück wurde niemand verletzt.","Adj. · Hinweis: umgangssprachlich auch als Verstärkung: schrecklich nett = sehr nett; Nomen: der Schrecken"]},{"f":"unterdrücken","b":["Etwas nicht zeigen oder nicht zulassen, oder jemanden mit Gewalt am Handeln hindern.","Sie konnte ein Lachen kaum unterdrücken.","Verb · untrennbar · Perf. hat unterdrückt · Rektion: etw./jdn. (Akk.) unterdrücken · Hinweis: auch politisch: ein Volk unterdrücken; Nomen: die Unterdrückung"]},{"f":"vorstellen","b":["Jemanden mit einer anderen Person bekannt machen oder etwas zeigen und erklären.","Darf ich dir meine Kollegin vorstellen?","Verb · trennbar (stellt vor) · Perf. hat vorgestellt · Rektion: jdm. jdn. vorstellen; `sich (Dat.) etw. vorstellen` = sich etw. im Kopf denken; `sich (Akk.) vorstellen` = sich bekannt machen"]},{"f":"verdrängen","b":["Etwas aus dem Bewusstsein schieben oder jemanden von seinem Platz wegdrängen.","Er hat den Streit mit seinem Bruder lange verdrängt.","Verb · untrennbar · Perf. hat verdrängt · Rektion: etw. (Akk.) verdrängen · Hinweis: psychologisch: Gefühle oder Erinnerungen verdrängen; Nomen: die Verdrängung"]},{"f":"missfallen","b":["Jemandem nicht gefallen, bei jemandem Unmut auslösen.","Seine Antwort missfiel dem Chef.","Verb · untrennbar · unregelmäßig: Prät. missfiel · Perf. hat missfallen · Rektion: jdm. missfallen (Dativ) · Hinweis: eher formell; Gegenteil: gefallen"]},{"f":"entschließen","b":["Sich persönlich für etwas entscheiden, oft nach längerem Zweifeln.","Ich habe mich entschlossen, Deutsch zu lernen.","Verb · untrennbar · unregelmäßig: Prät. entschloss sich · Perf. hat sich entschlossen · Rektion: sich zu etw. entschließen · Hinweis: meist reflexiv; betont die innere, persönliche Entscheidung (nach Zweifeln); Unterschied zu `beschließen`: entschließen = persönliche Entscheidung, beschließen = offizielle oder gemeinsame Entscheidung; Nomen: der Entschluss; Adjektiv: entschlossen (fest, willensstark)"]},{"f":"beherrschen","b":["Etwas sehr gut können oder jemanden oder etwas unter Kontrolle haben.","Sie beherrscht vier Sprachen fließend.","Verb · untrennbar · Perf. hat beherrscht · Rektion: etw./jdn. (Akk.) beherrschen · Hinweis: reflexiv: sich beherrschen = ruhig bleiben; Nomen: die Beherrschung (z. B. die Beherrschung verlieren)"]},{"f":"mittelmäßig","b":["Nicht gut und nicht schlecht, nur durchschnittlich.","Das Essen im Restaurant war leider nur mittelmäßig.","Adj. · Hinweis: oft leicht abwertend; Nomen: die Mittelmäßigkeit; ähnlich: durchschnittlich (neutraler)"]},{"f":"bejahen","b":["Mit Ja antworten oder etwas als richtig anerkennen.","Der Zeuge bejahte die Frage des Richters.","Verb · untrennbar · Perf. hat bejaht · Rektion: etw. (Akk.) bejahen · Hinweis: eher formell; Nomen: die Bejahung; Gegenteil: verneinen"]},{"f":"verneinen","b":["Mit Nein antworten oder etwas als nicht wahr bezeichnen.","Er verneinte, den Mann zu kennen.","Verb · untrennbar · Perf. hat verneint · Rektion: etw. (Akk.) verneinen · Hinweis: eher formell; Nomen: die Verneinung; Grammatik: Verneinung mit nicht/kein; Gegenteil: bejahen"]},{"f":"aufschlagen","b":["Ein Buch oder eine Zeitung öffnen, ein Zelt aufbauen oder hart auf etwas treffen.","Schlagen Sie bitte Seite 20 in Ihrem Buch auf.","Verb · trennbar (schlägt auf) · unregelmäßig: Prät. schlug auf · Perf. hat aufgeschlagen (aber ist aufgeschlagen, wenn man hart auf etwas trifft: Er ist mit dem Kopf auf dem Boden aufgeschlagen) · Rektion: etw. (Akk.) aufschlagen · Hinweis: Bedeutungen: eine Seite/ein Buch aufschlagen; Zelte aufschlagen (aufbauen); Die Preise schlagen auf (steigen)"]},{"f":"Tresor","b":["Ein sicherer Metallschrank für Geld und wichtige Dinge.","Der Schmuck liegt im Tresor der Bank.","Nomen · der · Pl. die Tresore · Hinweis: ähnlich: der Safe; einen Tresor knacken = ihn mit Gewalt öffnen"]},{"f":"zwingen","b":["Jemanden gegen seinen Willen dazu bringen, etwas zu tun.","Niemand kann dich zwingen, den Vertrag zu unterschreiben.","Verb · – · unregelmäßig: Prät. zwang · Perf. hat gezwungen · Rektion: jdn. zu etw. zwingen / jdn. zwingen, etw. zu tun · Hinweis: reflexiv: sich zwingen = sich mit Mühe überwinden; Nomen: der Zwang"]},{"f":"waschen","b":["Etwas mit Wasser und Seife sauber machen.","Ich wasche jeden Samstag meine Wäsche.","Verb · – · unregelmäßig: Prät. wusch · Perf. hat gewaschen · Rektion: etw. (Akk.) waschen; sich (Dativ) die Hände waschen · Hinweis: du wäschst, er wäscht; Nomen: die Wäsche"]},{"f":"Impfung","b":["Eine Spritze, die vor einer Krankheit schützen soll.","Für die Reise brauchst du eine Impfung gegen Gelbfieber.","Nomen · die · Pl. die Impfungen · Hinweis: Impfung gegen + Akk. (eine Impfung gegen Grippe); Verb: impfen (hat geimpft), sich impfen lassen"]},{"f":"Beamte","b":["Eine Person, die im Dienst des Staates arbeitet und einen besonderen Rechtsstatus hat.","Der Beamte überprüfte die Unterlagen.","Nomen · der · Pl. die Beamten · Hinweis: dekliniert wie ein Adjektiv (ein Beamter, die Beamten); weiblich: die Beamtin; Gegenteil: der/die Angestellte (im öffentlichen Dienst ohne Beamtenstatus)"]},{"f":"Kuvert","b":["Ein Briefumschlag.","Sie steckte den Brief in ein Kuvert und klebte es zu.","Nomen · das · Pl. die Kuverts · Hinweis: vor allem süddeutsch, österreichisch und schweizerisch; Standard: der Briefumschlag"]},{"f":"Hilfsgut","b":["Etwas wie Essen, Medizin oder Kleidung, das man Menschen in Not schickt.","Das Rote Kreuz verteilte Hilfsgüter an die Betroffenen.","Nomen · das · Pl. die Hilfsgüter · Hinweis: wird meist im Plural benutzt; typisch: Hilfsgüter liefern/verteilen; ähnlich: die Hilfslieferung"]},{"f":"erbitten","b":["Höflich und formell um etwas bitten.","Wir erbitten Ihre Antwort bis Freitag.","Verb · untrennbar · unregelmäßig: Prät. erbat · Perf. hat erbeten · Rektion: etw. von jdm. erbitten · Hinweis: formell/gehoben; Passiv: Nähere Informationen wurden erbeten; ähnlich: bitten um + Akk."]},{"f":"verwüsten","b":["Etwas so stark zerstören, dass nur Chaos und Schaden bleiben.","Der Sturm verwüstete das ganze Dorf.","Verb · untrennbar · Perf. hat verwüstet · Rektion: etw. (Akk.) verwüsten · Hinweis: Nomen: die Verwüstung; Adjektiv: verwüstet; verwandt: die Wüste"]},{"f":"zusagen","b":["Versprechen, dass man kommt oder etwas tut; auch: jdm. gefallen.","Ich habe ihm zugesagt, beim Umzug zu helfen.","Verb · trennbar (sagt zu) · Perf. hat zugesagt · Rektion: jdm. etw. zusagen · Hinweis: zweite Bedeutung: Das Angebot sagt mir zu (= gefällt mir); Gegenteil: absagen; Nomen: die Zusage"]}],"key":"fc-known-word-211126"};</script>
