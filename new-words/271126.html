<script>const D={"head":["Worter","Definition","Beispiel","Note"],"labels":["Definition","Beispiel","Note"],"cards":[{"f":"abgewöhnen","b":["Jemandem helfen, ein schlechtes Verhalten, das er immer wieder zeigt, aufzugeben.","Er hat sich das Rauchen abgewöhnt.","Verb · trennbar (gewöhnt ab) · Perf. hat abgewöhnt · Rektion: jdm. etw. abgewöhnen / sich (Dat.) etw. abgewöhnen · Hinweis: Gegenteil: sich etw. angewöhnen"]},{"f":"anordnen","b":["Offiziell verlangen, dass etwas getan wird.","Der Arzt hat strenge Bettruhe angeordnet.","Verb · trennbar (ordnet an) · Perf. hat angeordnet · Rektion: etw. anordnen; anordnen, dass … · Hinweis: auch: Dinge in eine Reihenfolge bringen; Nomen: die Anordnung"]},{"f":"Anteilnahme","b":["Das Mitgefühl, das man anderen in der Trauer zeigt.","Wir sprechen den Angehörigen unsere aufrichtige Anteilnahme aus.","Nomen · die · kein Plural · Hinweis: Anteilnahme zeigen / aussprechen; Verb: Anteil nehmen (an + Dat.)"]},{"f":"aufrichtig","b":["Ehrlich und ohne Verstellung.","Er hat sich aufrichtig bei ihr entschuldigt.","Adj. · Hinweis: aufrichtiges Beileid; Nomen: die Aufrichtigkeit; Synonym: ehrlich"]},{"f":"aussprechen","b":["Etwas in Worten ausdrücken; die Laute eines Wortes bilden.","Sie sprach ihm ihr Beileid aus.","Verb · trennbar (spricht aus) · unregelmäßig: Prät. sprach aus · Perf. hat ausgesprochen · Rektion: jdm. etw. aussprechen (Beileid, Dank, Lob) · Hinweis: sich aussprechen = offen reden (mit jdm. über etw.); Nomen: die Aussprache"]},{"f":"ausstehen","b":["Jemanden oder etwas nur schwer ertragen können; auch: noch nicht eingetroffen sein.","Ich kann ihn auf den Tod nicht ausstehen.","Verb · trennbar (steht aus) · unregelmäßig: Prät. stand aus · Perf. hat ausgestanden (süddt. auch ist; Noch prüfen) · Rektion: jdn./etw. nicht ausstehen können · Hinweis: jdn. auf den Tod nicht ausstehen können = jdn. extrem unsympathisch finden; Bedeutung 2: noch fehlen (Die Antwort steht noch aus)"]},{"f":"basteln","b":["Mit den Händen aus Papier oder anderen Materialien etwas herstellen.","Wir basteln mit den Kindern Weihnachtsschmuck.","Verb · – · Perf. hat gebastelt · Rektion: etw. basteln; an + Dat. basteln · Hinweis: auch: an etw. herumbasteln"]},{"f":"Beileid","b":["Worte, mit denen man seine Trauer über einen Todesfall ausdrückt.","Mein herzliches Beileid zum Tod Ihres Mannes.","Nomen · das · kein Plural · Hinweis: Beileid aussprechen / bekunden; Formel: Mein aufrichtiges Beileid"]},{"f":"berühren","b":["Mit der Hand oder dem Körper kurz an etwas kommen; auch: jemanden seelisch bewegen.","Seine Rede hat mich tief berührt.","Verb · untrennbar · Perf. hat berührt · Rektion: jdn./etw. berühren · Hinweis: konkret und übertragen; Nomen: die Berührung"]},{"f":"betreffen","b":["Für jemanden gelten oder jemanden angehen.","Die neue Regel betrifft alle Mitarbeitenden.","Verb · untrennbar · unregelmäßig: Prät. betraf · Perf. hat betroffen · Rektion: jdn./etw. betreffen · Hinweis: was … betrifft = in Bezug auf; betroffen sein von + Dat."]},{"f":"einschläfern","b":["Ein krankes Tier mit einer Spritze schmerzlos sterben lassen; auch: jemanden müde machen.","Der Tierarzt musste den alten Hund einschläfern.","Verb · trennbar (schläfert ein) · Perf. hat eingeschläfert · Rektion: jdn./ein Tier einschläfern · Hinweis: in der Wortliste als „eingeschläfert“ (Partizip II); oft im Passiv: Der Hund wurde eingeschläfert; vs einschlafen (ist eingeschlafen) = in den Schlaf fallen"]},{"f":"erkranken","b":["Durch eine Infektion oder ein Leiden nicht mehr gesund sein.","Viele Kinder sind an einer Grippe erkrankt.","Verb · untrennbar · Perf. ist erkrankt · Rektion: an + Dat. erkranken · Hinweis: vs kranken: kranken (an + Dat.) = gehoben, an einem Mangel leiden (Das Projekt krankt an mangelnder Planung; Perf. hat gekrankt)"]},{"f":"Floskel","b":["Eine feste Redewendung, die oft ohne echte Bedeutung gesagt wird.","„Mit freundlichen Grüßen“ ist eine höfliche Floskel am Briefende.","Nomen · die · Pl. die Floskeln · Hinweis: oft abwertend (leere Floskel)"]},{"f":"gebrechlich","b":["Alt und körperlich schwach.","Meine Großmutter ist inzwischen sehr gebrechlich.","Adj. · Hinweis: sagt man vor allem von alten Menschen; Nomen: die Gebrechlichkeit"]},{"f":"Grab","b":["Die Stelle auf dem Friedhof, an der ein Toter in der Erde liegt.","Sie legt jedes Jahr Blumen auf das Grab ihres Vaters.","Nomen · das · Pl. die Gräber · Hinweis: verwandt: begraben (unregelmäßig: Prät. begrub, hat begraben); Redewendung: sich sein eigenes Grab schaufeln"]},{"f":"gruselig","b":["Unheimlich, sodass man Angst bekommt.","Der alte Keller war dunkel und gruselig.","Adj. · Hinweis: eher umgangssprachlich; Verb: sich gruseln (hat sich gegruselt); Nomen: der Grusel"]},{"f":"Hebamme","b":["Eine Frau, die Schwangere betreut und bei der Geburt hilft.","Die Hebamme besucht die Familie nach der Geburt zu Hause.","Nomen · die · Pl. die Hebammen"]},{"f":"Herberge","b":["Eine einfache Unterkunft für Reisende.","Die Pilger übernachteten in einer Herberge.","Nomen · die · Pl. die Herbergen · Hinweis: Jugendherberge; eher gehoben oder veraltet"]},{"f":"Hospiz","b":["Eine Einrichtung, in der schwer kranke Menschen am Lebensende betreut werden.","Er verbrachte seine letzten Wochen in einem Hospiz.","Nomen · das · Pl. die Hospize · Hinweis: Hospizdienst; Palliativmedizin"]},{"f":"kondolieren","b":["Jemandem nach einem Todesfall sein Beileid aussprechen.","Wir kondolierten der Familie nach dem Todesfall.","Verb · untrennbar · Perf. hat kondoliert · Rektion: jdm. (zu etw.) kondolieren · Hinweis: förmlich: jdm. zum Tod seines Vaters kondolieren"]},{"f":"Krippe","b":["Eine Einrichtung, in der kleine Kinder bis etwa drei Jahre betreut werden.","Mit einem Jahr kommt das Kind in die Krippe.","Nomen · die · Pl. die Krippen · Hinweis: Kinderkrippe; auch: Futterkrippe (Tiere), Weihnachtskrippe"]},{"f":"Leib","b":["(Gehoben) der Körper eines Menschen.","Er spürte die Kälte am ganzen Leib.","Nomen · der · Pl. die Leiber · Hinweis: gehoben oder in festen Wendungen: am eigenen Leib erfahren, mit Leib und Seele; verwandt: leibhaftig = in Person, wirklich da (Adj.)"]},{"f":"Obduktion","b":["Die ärztliche Untersuchung eines Toten, um die Todesursache festzustellen.","Die Obduktion ergab, dass er an einem Herzinfarkt gestorben war.","Nomen · die · Pl. die Obduktionen · Hinweis: vs Autopsie: beide Wörter meinen heute meist dasselbe, Obduktion ist in Deutschland der übliche Fachbegriff (Noch prüfen: feiner Unterschied); Verb: obduzieren"]},{"f":"pflegen","b":["Sich um einen kranken oder alten Menschen kümmern.","Sie pflegt ihre kranke Mutter zu Hause.","Verb · – · Perf. hat gepflegt · Rektion: jdn./etw. pflegen · Hinweis: auch: Kontakte pflegen; pflegen + zu + Infinitiv = gewöhnlich tun (Er pflegt früh aufzustehen); Nomen: die Pflege"]},{"f":"ringen","b":["Kämpfen; sich mit großer Anstrengung um etwas bemühen.","Er ringt um Luft.","Verb · – · unregelmäßig: Prät. rang · Perf. hat gerungen · Rektion: um + Akk. ringen / mit + Dat. ringen · Hinweis: nach Luft ringen; mit sich ringen = lange überlegen; mit dem Tod ringen"]},{"f":"Säugling","b":["Ein ganz kleines Kind im ersten Lebensjahr.","Ein Säugling muss auch nachts mehrmals gefüttert werden.","Nomen · der · Pl. die Säuglinge · Hinweis: Alltagssprache: das Baby"]},{"f":"schaukeln","b":["Sich auf einem Sitz, der an Seilen oder Ketten hängt, vor und zurück bewegen, zum Beispiel auf dem Spielplatz.","Die Kinder schaukeln im Garten.","Verb · – · Perf. hat geschaukelt · Rektion: – · Hinweis: auch transitiv: ein Kind schaukeln; umgangssprachlich: etw. schaukeln = erfolgreich erledigen"]},{"f":"Schnuller","b":["Ein Gummi- oder Silikonteil, an dem ein Baby saugt, um sich zu beruhigen.","Das Baby schläft ruhiger, wenn es seinen Schnuller hat.","Nomen · der · Pl. die Schnuller · Hinweis: regional auch: der Nuckel"]},{"f":"senil","b":["Durch das hohe Alter geistig stark abgebaut.","Man sollte alte Menschen nicht vorschnell als senil bezeichnen.","Adj. · Hinweis: oft abwertend; medizinisch genauer: dement"]},{"f":"stillen","b":["Ein Baby mit Muttermilch ernähren.","Sie stillt ihr Baby alle drei Stunden.","Verb · – · Perf. hat gestillt · Rektion: jdn. stillen · Hinweis: auch: den Durst / den Hunger stillen = befriedigen"]},{"f":"Streitigkeit","b":["Eine Auseinandersetzung zwischen Personen, besonders um Besitz oder Rechte.","Nach dem Tod der Mutter gab es Streitigkeiten unter den Erben.","Nomen · die · Pl. die Streitigkeiten · Hinweis: meist im Plural; vs Streit: der Streit ist die Auseinandersetzung allgemein, Streitigkeiten sind mehrere einzelne Auseinandersetzungen, oft um Besitz oder Rechte; Streitigkeiten unter + Dat. (unter den Erben) / zwischen + Dat. / um + Akk. (um das Erbe)"]},{"f":"Testament","b":["Ein Schriftstück, in dem jemand bestimmt, wer sein Erbe bekommt.","Im Testament stand, dass die Tochter das Haus erbt.","Nomen · das · Pl. die Testamente · Hinweis: ein Testament machen / verfassen; auch: das Alte / Neue Testament"]},{"f":"Töpfchen","b":["Ein kleines Gefäß, auf das sich Kleinkinder setzen, wenn sie auf die Toilette müssen.","Unser Sohn geht jetzt schon allein aufs Töpfchen.","Nomen · das · Pl. die Töpfchen · Hinweis: Verkleinerungsform von der Topf; aufs Töpfchen gehen; Töpfchentraining"]},{"f":"tröstlich","b":["Beruhigend, wenn man traurig ist.","Es ist tröstlich zu wissen, dass er nicht gelitten hat.","Adj. · Hinweis: Verb: trösten (hat getröstet); Nomen: der Trost"]},{"f":"umkommen","b":["Bei einem Unfall oder Unglück sterben.","Bei dem Brand sind drei Menschen umgekommen.","Verb · trennbar (kommt um) · unregelmäßig: Prät. kam um · Perf. ist umgekommen · Rektion: – · Hinweis: bei + Dat. (bei einem Unfall); umgangssprachlich: vor Langeweile umkommen"]},{"f":"vererben","b":["Jemandem nach dem eigenen Tod Besitz hinterlassen.","Sie hat ihrem Sohn das Haus vererbt.","Verb · untrennbar · Perf. hat vererbt · Rektion: jdm. etw. vererben · Hinweis: vs erben: vererben = Besitz weitergeben, erben = Besitz bekommen (etw. von jdm. erben); auch für Eigenschaften und Gene"]},{"f":"Vermögen","b":["Alles, was jemand an Geld und Besitz hat.","Er hat sein ganzes Vermögen gespendet.","Nomen · das · Pl. die Vermögen (selten) · Hinweis: auch: die Fähigkeit (gehoben); Verb: vermögen (vermag, vermochte, hat vermocht)"]},{"f":"versterben","b":["(Gehoben, amtlich) sterben.","Der Patient ist gestern Nacht im Krankenhaus verstorben.","Verb · untrennbar · unregelmäßig: Prät. verstarb · Perf. ist verstorben · Rektion: – · Hinweis: höflicher als „sterben“; Partizip als Nomen: der/die Verstorbene"]},{"f":"Wechseljahre","b":["Die Lebensphase, in der sich der Körper einer Frau hormonell umstellt und die Fruchtbarkeit endet.","Sie hat in den Wechseljahren oft Schlafprobleme.","Nomen · die · Pl. die Wechseljahre (nur Plural) · Hinweis: medizinisch: das Klimakterium"]},{"f":"Wiege","b":["Ein kleines Bett für ein Baby, das man sanft hin und her bewegen kann.","Die Mutter legt das Baby behutsam in die Wiege.","Nomen · die · Pl. die Wiegen · Hinweis: Redewendung: von der Wiege bis zur Bahre = das ganze Leben"]},{"f":"Windel","b":["Ein saugfähiges Tuch oder Höschen, das ein Baby um den Unterkörper trägt.","Ich muss dem Baby schnell die Windel wechseln.","Nomen · die · Pl. die Windeln · Hinweis: eine Windel wechseln"]},{"f":"wippen","b":["Sich mit leichten Bewegungen auf und ab bewegen.","Das Kind wippt auf der Wippe.","Verb · – · Perf. hat gewippt · Rektion: – · Hinweis: mit dem Fuß wippen; die Wippe = Spielgerät"]},{"f":"zornig","b":["Sehr wütend.","Der Chef war zornig, weil die Frist verpasst wurde.","Adj. · Rektion: zornig auf + Akk. / über + Akk. · Hinweis: stärker als „ärgerlich“; Nomen: der Zorn"]}],"key":"fc-known-worterbuch"};</script>
