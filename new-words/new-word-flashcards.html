<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neue Wörter Karteikarten</title>
<style>
:root{--bg:#fafaf8;--ink:#222;--soft:#666;--card:#fff;--line:#ddd;--ok:#2e7d32;--no:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--ink:#eee;--soft:#aaa;--card:#222;--line:#444;--ok:#66bb6a;--no:#ef5350}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px}
main{width:100%;max-width:640px}
main.tv{max-width:1200px}
main.tv .cardonly{display:none}
.bar{display:flex;justify-content:space-between;color:var(--soft);font-size:14px;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:280px;padding:24px;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.front{font-size:34px;font-weight:600;text-align:center}
.back p{margin:0 0 12px}.lab{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);display:block}
.hint{text-align:center;color:var(--soft);font-size:13px;margin-top:8px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{flex:1;padding:10px 14px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
button.ok{border-color:var(--ok);color:var(--ok)}button.no{border-color:var(--no);color:var(--no)}
.scroll{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--card)}td.chk{text-align:center}
</style></head><body><main id="main">
<div class="bar"><span id="pos"></span><span id="stat"></span><label class="cardonly"><input type="checkbox" id="rev"> <span id="revlab"></span></label></div>
<div class="card cardonly" id="card"></div>
<div class="hint cardonly">↓ oder Leertaste: umdrehen · → Gewusst · ← Noch nicht · ↑ Alle Wörter</div>
<div class="row cardonly"><button class="no" id="no">Noch nicht</button><button class="ok" id="ok">Gewusst</button></div>
<div class="row"><button id="all">Alle Wörter</button><button id="reset">Zurücksetzen</button></div>
<div class="scroll" id="tbl" hidden></div>
</main>
<script>
const D={"head":["Worter","Definition","Beispiel","Note"],"labels":["Definition","Beispiel","Note"],"cards":[{"f":"überzeugen","b":["Jemanden durch Argumente oder Beweise dazu bringen, etwas zu glauben oder zu tun.","Sie überzeugte ihren Chef von ihrem Plan.","Der Akkusativ steht für die Person; `von` + Dativ steht für die Sache. Perfekt: hat überzeugt. Reflexiv: sich überzeugen = sich selbst Gewissheit verschaffen."]},{"f":"auffordern","b":["Jemanden nachdrücklich bitten oder verpflichten, etwas zu tun.","Der Lehrer forderte die Schüler auf, leise zu sein.","`jdn. zu etw. auffordern`. Trennbar: fordert auf. Stärker als \"bitten\"."]},{"f":"beschließen","b":["Als Gruppe oder Behörde offiziell entscheiden, etwas zu tun; auch: etwas als Ergebnis des Nachdenkens festlegen.","Der Stadtrat hat beschlossen, eine neue Brücke zu bauen.","Nicht reflexiv. Meist formelle oder gemeinsame Entscheidung (Rat, Gericht, Vorstand): einen Beschluss fassen. Unterschied zu `sich entschließen`: beschließen = offizielle Entscheidung, entschließen = persönliche Entscheidung. Schweizer Schreibweise: beschliessen. Perfekt: hat beschlossen."]},{"f":"Zaun","b":["Eine Begrenzung aus Holz, Draht oder Metall um ein Grundstück.","Der Zaun um den Garten ist frisch gestrichen.","Nomen, maskulin: der Zaun, die Zäune. Redewendung: einen Streit vom Zaun brechen = ihn mutwillig beginnen."]},{"f":"begeistern","b":["Bei jemandem große Freude und Interesse für etwas wecken.","Die Rede des Trainers begeisterte das ganze Team.","Perfekt: hat begeistert. `jdn. für etw. begeistern`; reflexiv: `sich für etw. begeistern`. Adjektiv: begeistert (von/über)."]},{"f":"schrecklich","b":["Sehr schlimm, furchtbar oder Angst auslösend.","Der Unfall war schrecklich, zum Glück wurde niemand verletzt.","Adjektiv. Umgangssprachlich auch als Verstärkung: schrecklich nett = sehr nett. Nomen: der Schrecken."]},{"f":"unterdrücken","b":["Etwas nicht zeigen oder nicht zulassen, oder jemanden mit Gewalt am Handeln hindern.","Sie konnte ein Lachen kaum unterdrücken.","Nicht trennbar: unterdrückt, hat unterdrückt. Auch politisch: ein Volk unterdrücken. Nomen: die Unterdrückung."]},{"f":"vorstellen","b":["Jemanden mit einer anderen Person bekannt machen oder etwas zeigen und erklären.","Darf ich dir meine Kollegin vorstellen?","Trennbar: stellt vor, hat vorgestellt. `sich (Dat.) etw. vorstellen` = sich etw. im Kopf denken; `sich (Akk.) vorstellen` = sich bekannt machen."]},{"f":"verdrängen","b":["Etwas aus dem Bewusstsein schieben oder jemanden von seinem Platz wegdrängen.","Er hat den Streit mit seinem Bruder lange verdrängt.","Nicht trennbar: hat verdrängt. Psychologisch: Gefühle oder Erinnerungen verdrängen. Nomen: die Verdrängung."]},{"f":"missfallen","b":["Jemandem nicht gefallen, bei jemandem Unmut auslösen.","Seine Antwort missfiel dem Chef.","Dativ: `jdm. missfallen`. Eher formell. Perfekt: hat missfallen. Nicht trennbar. Gegenteil: gefallen."]},{"f":"entschließen","b":["Sich persönlich für etwas entscheiden, oft nach längerem Zweifeln.","Ich habe mich entschlossen, Deutsch zu lernen.","Meist reflexiv: `sich zu etw. entschließen`. Betont die innere, persönliche Entscheidung (nach Zweifeln). Unterschied zu `beschließen`: entschließen = persönliche Entscheidung, beschließen = offizielle oder gemeinsame Entscheidung. Perfekt: hat sich entschlossen. Nomen: der Entschluss. Adjektiv: entschlossen (fest, willensstark)."]},{"f":"beherrschen","b":["Etwas sehr gut können oder jemanden oder etwas unter Kontrolle haben.","Sie beherrscht vier Sprachen fließend.","Nicht trennbar: hat beherrscht. Reflexiv: sich beherrschen = ruhig bleiben. Nomen: die Beherrschung (z. B. die Beherrschung verlieren)."]},{"f":"mittelmäßig","b":["Nicht gut und nicht schlecht, nur durchschnittlich.","Das Essen im Restaurant war leider nur mittelmäßig.","Adjektiv, oft leicht abwertend. Nomen: die Mittelmäßigkeit. Ähnlich: durchschnittlich (neutraler)."]},{"f":"bejahen","b":["Mit Ja antworten oder etwas als richtig anerkennen.","Der Zeuge bejahte die Frage des Richters.","Perfekt: hat bejaht. Eher formell. Nomen: die Bejahung. Gegenteil: verneinen."]},{"f":"verneinen","b":["Mit Nein antworten oder etwas als nicht wahr bezeichnen.","Er verneinte, den Mann zu kennen.","Perfekt: hat verneint. Eher formell. Nomen: die Verneinung; Grammatik: Verneinung mit nicht/kein. Gegenteil: bejahen."]},{"f":"aufschlagen","b":["Ein Buch oder eine Zeitung öffnen, ein Zelt aufbauen oder hart auf etwas treffen.","Schlagen Sie bitte Seite 20 in Ihrem Buch auf.","unregelmäßig: Prät. schlug auf, Perf. hat aufgeschlagen (aber ist aufgeschlagen, wenn man hart auf etwas trifft: Er ist mit dem Kopf auf dem Boden aufgeschlagen); trennbar. Bedeutungen: eine Seite/ein Buch aufschlagen; Zelte aufschlagen (aufbauen); Die Preise schlagen auf (steigen)."]},{"f":"Tresor","b":["Ein sicherer Metallschrank für Geld und wichtige Dinge.","Der Schmuck liegt im Tresor der Bank.","der Tresor, Plural: die Tresore. Ähnlich: der Safe. Einen Tresor knacken = ihn mit Gewalt öffnen."]},{"f":"zwingen","b":["Jemanden gegen seinen Willen dazu bringen, etwas zu tun.","Niemand kann dich zwingen, den Vertrag zu unterschreiben.","unregelmäßig: Prät. zwang, Perf. hat gezwungen; jdn. zu etw. zwingen / jdn. zwingen, etw. zu tun. Reflexiv: sich zwingen = sich mit Mühe überwinden. Nomen: der Zwang."]},{"f":"waschen","b":["Etwas mit Wasser und Seife sauber machen.","Ich wasche jeden Samstag meine Wäsche.","unregelmäßig: Prät. wusch, Perf. hat gewaschen; du wäschst, er wäscht. Reflexiv: sich (Dativ) die Hände waschen. Nomen: die Wäsche."]},{"f":"Impfungen","b":["Spritzen, die vor einer Krankheit schützen sollen.","Für die Reise brauchst du mehrere Impfungen.","Plural von die Impfung (Singular). Verb: impfen (hat geimpft), sich impfen lassen. Impfung gegen + Akk.: eine Impfung gegen Grippe."]},{"f":"Beamte","b":["Eine Person, die im Dienst des Staates arbeitet und einen besonderen Rechtsstatus hat.","Der Beamte überprüfte die Unterlagen.","der Beamte (dekliniert wie ein Adjektiv: ein Beamter, die Beamten); weiblich: die Beamtin. Gegenteil: der/die Angestellte (im öffentlichen Dienst ohne Beamtenstatus)."]},{"f":"Kuvert","b":["Ein Briefumschlag.","Sie steckte den Brief in ein Kuvert und klebte es zu.","das Kuvert, Plural: die Kuverts. Vor allem süddeutsch, österreichisch und schweizerisch; Standard: der Briefumschlag."]},{"f":"Hilfsgüter","b":["Dinge wie Essen, Medizin und Kleidung, die man Menschen in Not schickt.","Das Rote Kreuz verteilte Hilfsgüter an die Betroffenen.","Meist im Plural: die Hilfsgüter (Singular: das Hilfsgut). Typisch: Hilfsgüter liefern/verteilen. Ähnlich: die Hilfslieferung."]},{"f":"erbitten","b":["Höflich und formell um etwas bitten.","Wir erbitten Ihre Antwort bis Freitag.","unregelmäßig: Prät. erbat, Perf. hat erbeten; etw. von jdm. erbitten; formell/gehoben. Passiv: Nähere Informationen wurden erbeten. Ähnlich: bitten um + Akk."]},{"f":"verwüsten","b":["Etwas so stark zerstören, dass nur Chaos und Schaden bleiben.","Der Sturm verwüstete das ganze Dorf.","Perf. hat verwüstet; nicht trennbar. Nomen: die Verwüstung. Adjektiv: verwüstet. Verwandt: die Wüste."]},{"f":"zusagen","b":["Versprechen, dass man kommt oder etwas tut; auch: jdm. gefallen.","Ich habe ihm zugesagt, beim Umzug zu helfen.","trennbar; Perf. hat zugesagt (sagte zu); jdm. etw. zusagen. Zweite Bedeutung: Das Angebot sagt mir zu (= gefällt mir). Gegenteil: absagen. Nomen: die Zusage."]}],"key":"fc-known-new-word"},ALL=D.cards,LAB=D.labels;
let cur=-1,flip=false,known={},table=false;
try{known=JSON.parse(localStorage.getItem(D.key)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(D.key,JSON.stringify(known))}catch(e){}};
const el=(id)=>document.getElementById(id);
const esc=(s)=>s.replace(/[&<>]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/`([^`]+)`/g,'<b>$1</b>');
const unknown=()=>ALL.map((_,k)=>k).filter((k)=>!known[ALL[k].f]);
el('revlab').textContent=LAB[0]+' zuerst';
const HR='<hr style="width:100%;border:0;border-top:1px solid var(--line);margin:16px 0">';
function stats(){
  el('pos').textContent='Unbekannt: '+unknown().length+'/'+ALL.length;
  el('stat').textContent='Gewusst: '+(ALL.length-unknown().length)+'/'+ALL.length;
}
function drawTable(){
  const th=D.head.concat(['Bekannt']).map((h)=>'<th>'+esc(h)+'</th>').join('');
  const body=ALL.map((c,k)=>'<tr>'+[c.f].concat(c.b).map((t)=>'<td>'+esc(t)+'</td>').join('')+'<td class="chk"><input type="checkbox" data-i="'+k+'"'+(known[c.f]?' checked':'')+' aria-label="Bekannt"></td></tr>').join('');
  el('tbl').innerHTML='<table><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table>';
}
function draw(){
  stats();
  if(table)return;
  if(cur<0){el('card').innerHTML='<div class="front">'+(ALL.length&&!unknown().length?'Alle Wörter gewusst':'Keine Karten')+'</div>';return}
  const c=ALL[cur],rev=el('rev').checked;
  const front='<div class="front">'+esc(c.f)+'</div>';
  const back='<div class="back">'+c.b.map((t,k)=>t?'<p><span class="lab">'+esc(LAB[k])+'</span>'+esc(t)+'</p>':'').join('')+'</div>';
  const alt='<div class="front" style="font-size:22px;font-weight:500">'+esc(c.b[0])+'</div>';
  el('card').innerHTML=flip?front+HR+back:(rev?alt:front);
}
function pick(){
  const u=unknown();
  if(!u.length)return -1;
  const o=u.filter((k)=>k!==cur),p=o.length?o:u;
  return p[Math.floor(Math.random()*p.length)];
}
function next(){cur=pick();flip=false;draw()}
function mark(v){if(cur<0)return;known[ALL[cur].f]=v;save();next()}
function showTable(on){
  table=on;
  el('main').classList.toggle('tv',on);
  el('tbl').hidden=!on;
  el('all').textContent=on?'Karten':'Alle Wörter';
  if(on)drawTable();
  if(!on&&(cur<0||known[ALL[cur].f])&&unknown().length)next();
  else draw();
}
el('card').onclick=()=>{if(cur>=0){flip=!flip;draw()}};
el('rev').onchange=()=>{flip=false;draw()};
el('ok').onclick=()=>mark(true);
el('no').onclick=()=>mark(false);
el('all').onclick=()=>showTable(!table);
el('reset').onclick=()=>{known={};save();cur=-1;if(table)drawTable();if(!table)next();else stats()};
el('tbl').onchange=(e)=>{const i=e.target.dataset&&e.target.dataset.i;if(i===undefined)return;known[ALL[i].f]=e.target.checked;save();stats()};
document.onkeydown=(e)=>{
  if(e.key==='ArrowUp'){e.preventDefault();showTable(!table);return}
  if(table)return;
  if(e.key===' '||e.key==='ArrowDown'){e.preventDefault();if(cur>=0){flip=!flip;draw()}}
  else if(e.key==='ArrowRight'){e.preventDefault();mark(true)}
  else if(e.key==='ArrowLeft'){e.preventDefault();mark(false)}
};
next();
</script></body></html>
