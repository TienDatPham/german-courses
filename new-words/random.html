<script>const D={"head":["Worter","Definition","Beispiel","Note"],"labels":["Definition","Beispiel","Note"],"cards":[{"f":"stöhnen","b":["Bei Schmerz, Anstrengung oder Lust einen tiefen Laut ausstoßen oder klagend seufzen.","Er stöhnte, als er den schweren Koffer die Treppe hochtrug.","Verb · – · Perf. hat gestöhnt · Rektion: über + Akk. (über die viele Arbeit stöhnen = klagen) · Hinweis: Nomen: das Stöhnen; ähnlich: ächzen"]},{"f":"Kuvert","b":["Ein Briefumschlag.","Sie steckte den Brief in ein Kuvert und klebte es zu.","Nomen · das · Pl. die Kuverts · Hinweis: vor allem süddeutsch, österreichisch und schweizerisch; Standard: der Briefumschlag"]},{"f":"schimpfen","b":["Ärgerlich und laut sagen, dass man etwas schlecht findet, oder beleidigende Wörter benutzen.","Der Vater schimpfte, weil das Kind wieder zu spät nach Hause kam.","Verb · – · Perf. hat geschimpft · Rektion: über + Akk. (über das Wetter schimpfen); mit + Dat. (mit dem Kind schimpfen = es ausschimpfen); auf + Akk. · Hinweis: auch: Schimpfwörter sagen; Nomen: das Schimpfwort"]},{"f":"räuchern","b":["Fleisch oder Fisch über brennendem Holz haltbar machen und ihm Geschmack geben.","Mein Onkel räuchert jedes Jahr Schinken.","Verb · – · Perf. hat geräuchert · Rektion: etw. (Akk.) räuchern · Hinweis: Adjektiv: geräuchert (geräucherter Lachs); Nomen: der Rauch; auch: Räucherstäbchen"]},{"f":"verdrängen","b":["Etwas aus dem Bewusstsein schieben oder jemanden von seinem Platz wegdrängen.","Er hat den Streit mit seinem Bruder lange verdrängt.","Verb · untrennbar · Perf. hat verdrängt · Rektion: etw. (Akk.) verdrängen · Hinweis: psychologisch: Gefühle oder Erinnerungen verdrängen; Nomen: die Verdrängung"]},{"f":"verneinen","b":["Mit Nein antworten oder etwas als nicht wahr bezeichnen.","Er verneinte, den Mann zu kennen.","Verb · untrennbar · Perf. hat verneint · Rektion: etw. (Akk.) verneinen · Hinweis: eher formell; Nomen: die Verneinung; Grammatik: Verneinung mit nicht/kein; Gegenteil: bejahen"]},{"f":"mahlen","b":["Körner oder andere harte Stoffe zu Pulver zerkleinern.","Er mahlt den Kaffee frisch.","Verb · – · unregelmäßig: Prät. mahlte · Perf. hat gemahlen · Rektion: etw. (Akk.) mahlen · Hinweis: Partizip II stark (gemahlen); nicht verwechseln mit malen (mit Farbe); Nomen: die Mühle"]},{"f":"jammern","b":["Sich laut und klagend über etwas beschweren oder sein Leid ausdrücken.","Er jammert ständig über das Wetter.","Verb · – · Perf. hat gejammert · Rektion: über + Akk.; um + Akk. (jammern um jdn.) · Hinweis: abwertend"]},{"f":"meckern","b":["Sich ständig unzufrieden über etwas äußern.","Er meckert immer über das Essen in der Kantine.","Verb · – · Perf. hat gemeckert · Rektion: über + Akk. · Hinweis: umgangssprachlich, abwertend; auch: die Ziege meckert; ähnlich: nörgeln, motzen"]},{"f":"nuscheln","b":["Undeutlich und leise sprechen, sodass man es schwer versteht.","Der Schauspieler nuschelt so, dass man ihn kaum versteht.","Verb · – · Perf. hat genuschelt · Rektion: – · Hinweis: umgangssprachlich; man spricht von \"Nuschler\""]},{"f":"Hilfsgut","b":["Etwas wie Essen, Medizin oder Kleidung, das man Menschen in Not schickt.","Das Rote Kreuz verteilte Hilfsgüter an die Betroffenen.","Nomen · das · Pl. die Hilfsgüter · Hinweis: wird meist im Plural benutzt; typisch: Hilfsgüter liefern/verteilen; ähnlich: die Hilfslieferung"]},{"f":"quasseln","b":["Viel und oft sinnlos reden.","Er quasselt den ganzen Tag, ohne etwas zu sagen.","Verb · – · Perf. hat gequasselt · Rektion: – · Hinweis: umgangssprachlich und abwertend"]},{"f":"schleifen","b":["Etwas mit einem harten Material scharf oder glatt machen.","Er schleift das Messer, damit es wieder scharf wird.","Verb · – · unregelmäßig: Prät. schliff · Perf. hat geschliffen · Rektion: etw. (Akk.) schleifen · Hinweis: in der Bedeutung \"über den Boden ziehen\" regelmäßig: schleifte, hat geschleift"]},{"f":"warnen","b":["Jemanden auf eine Gefahr aufmerksam machen.","Der Arzt warnte ihn vor den Folgen des Rauchens.","Verb · – · Perf. hat gewarnt · Rektion: jdn. vor + Dat. warnen · Hinweis: Nomen: die Warnung; ähnlich: ermahnen"]},{"f":"Rätsel","b":["Eine Frage oder Aufgabe, deren Lösung man erst finden muss; auch etwas, das man nicht versteht.","Das Verschwinden des Schiffes ist bis heute ein Rätsel.","Nomen · das · Pl. die Rätsel · Hinweis: ein Rätsel lösen; jdm. ein Rätsel sein; Adjektiv: rätselhaft; Verb: rätseln (über + Akk.)"]},{"f":"verstoßen","b":["Gegen eine Regel oder ein Gesetz handeln.","Die Firma hat gegen das Gesetz verstoßen.","Verb · untrennbar · unregelmäßig: Prät. verstieß · Perf. hat verstoßen · Rektion: gegen + Akk. · Hinweis: du/er verstößt; Nomen: der Verstoß; andere Bedeutung: jdn. verstoßen = aus der Gemeinschaft ausschließen"]},{"f":"sorgen","b":["Dafür arbeiten, dass jemand oder etwas gut versorgt ist.","Sie sorgt für ihre kranke Mutter.","Verb · – · Perf. hat gesorgt · Rektion: für + Akk. · Hinweis: reflexiv: sich sorgen um + Akk. = Angst haben (hat sich gesorgt)"]},{"f":"entschließen","b":["Sich persönlich für etwas entscheiden, oft nach längerem Zweifeln.","Ich habe mich entschlossen, Deutsch zu lernen.","Verb · untrennbar · unregelmäßig: Prät. entschloss sich · Perf. hat sich entschlossen · Rektion: sich zu etw. entschließen · Hinweis: meist reflexiv; betont die innere, persönliche Entscheidung (nach Zweifeln); Unterschied zu `beschließen`: entschließen = persönliche Entscheidung, beschließen = offizielle oder gemeinsame Entscheidung; Nomen: der Entschluss; Adjektiv: entschlossen (fest, willensstark)"]},{"f":"stottern","b":["Beim Sprechen Laute oder Silben wiederholen oder stocken.","Er stottert, wenn er aufgeregt ist.","Verb · – · Perf. hat gestottert · Rektion: – · Hinweis: auch bildlich: Der Motor stottert"]},{"f":"zwingen","b":["Jemanden gegen seinen Willen dazu bringen, etwas zu tun.","Niemand kann dich zwingen, den Vertrag zu unterschreiben.","Verb · – · unregelmäßig: Prät. zwang · Perf. hat gezwungen · Rektion: jdn. zu etw. zwingen / jdn. zwingen, etw. zu tun · Hinweis: reflexiv: sich zwingen = sich mit Mühe überwinden; Nomen: der Zwang"]},{"f":"erreichen","b":["An einem Ort oder Ziel ankommen oder jemanden telefonisch sprechen können.","Wir haben den Zug gerade noch erreicht.","Verb · untrennbar · Perf. hat erreicht · Rektion: etw./jdn. (Akk.) erreichen · Hinweis: ein Ziel erreichen; jdn. telefonisch erreichen; Nomen: die Erreichbarkeit"]},{"f":"bejahen","b":["Mit Ja antworten oder etwas als richtig anerkennen.","Der Zeuge bejahte die Frage des Richters.","Verb · untrennbar · Perf. hat bejaht · Rektion: etw. (Akk.) bejahen · Hinweis: eher formell; Nomen: die Bejahung; Gegenteil: verneinen"]},{"f":"Landstrich","b":["Ein Gebiet oder eine Gegend eines Landes.","In diesem Landstrich regnet es selten.","Nomen · der · Pl. die Landstriche · Standard: Landstrich; ähnlich: die Gegend, die Region"]},{"f":"ächzen","b":["Mit einem Laut des Schmerzes oder der Anstrengung stöhnen; auch von Holz gesagt, das knarrt.","Der Mann ächzte unter dem schweren Rucksack.","Verb · – · Perf. hat geächzt · Rektion: – · Hinweis: auch bildlich: Das Gebälk ächzt"]},{"f":"flüstern","b":["Sehr leise sprechen, fast ohne Stimme.","Sie flüsterte ihm das Geheimnis ins Ohr.","Verb · – · Perf. hat geflüstert · Rektion: jdm. etw. flüstern"]},{"f":"misstrauen","b":["Zweifeln, ob jemand oder etwas ehrlich und zuverlässig ist.","Er misstraut dem neuen Kollegen.","Verb · untrennbar · Perf. hat misstraut · Rektion: jdm. misstrauen (Dativ) · Hinweis: Nomen: das Misstrauen; Gegenteil: vertrauen"]},{"f":"verzeihen","b":["Jemandem nicht mehr böse sein wegen eines Fehlers.","Ich kann ihm seine Lüge nicht verzeihen.","Verb · untrennbar · unregelmäßig: Prät. verzieh · Perf. hat verziehen · Rektion: jdm. etw. verzeihen · Hinweis: Nomen: die Verzeihung (Verzeihung! = Entschuldigung); ähnlich: vergeben (gehobener)"]},{"f":"verreisen","b":["Für kurze oder längere Zeit von zu Hause an einen anderen Ort fahren.","Im Sommer verreisen wir immer für drei Wochen.","Verb · untrennbar · Perf. ist verreist · Rektion: – · Hinweis: Unterschied zu `reisen`: verreisen = von zu Hause wegfahren (Er ist verreist = nicht da); reisen = unterwegs sein, oft mit Ziel (nach Spanien reisen); Noch prüfen"]},{"f":"nachweisen","b":["Mit Beweisen zeigen, dass etwas wahr ist.","Die Polizei konnte dem Mann den Diebstahl nicht nachweisen.","Verb · trennbar (weist nach) · unregelmäßig: Prät. wies nach · Perf. hat nachgewiesen · Rektion: jdm. etw. nachweisen · Hinweis: Nomen: der Nachweis"]},{"f":"Antragsteller","b":["Eine Person, die bei einer Behörde schriftlich um eine Genehmigung oder Leistung bittet.","Der Antragsteller muss alle Unterlagen bis Montag einreichen.","Nomen · der · Pl. die Antragsteller · Hinweis: weiblich: die Antragstellerin; einen Antrag stellen; der Antrag, die Anträge"]}],"key":"fc-known-worterbuch"};</script>
