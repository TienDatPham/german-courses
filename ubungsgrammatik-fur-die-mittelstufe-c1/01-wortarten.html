<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wortarten – Übungsgrammatik für die Mittelstufe C1</title>
<style>
:root{--bg:#fafaf8;--ink:#222;--soft:#666;--card:#fff;--line:#ddd;--acc:#1a5fb4;--fld:#fffef6;--ok:#1b7a3d;--okbg:#eaf6ee}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--ink:#eee;--soft:#aaa;--card:#222;--line:#444;--acc:#7ab0ff;--fld:#2a2a22;--ok:#6fd392;--okbg:#1c2a21}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif;padding:16px}
main{max-width:860px;margin:0 auto}
a{color:var(--acc)}
h1{font-size:26px;margin:0 0 4px}
.sub{color:var(--soft);font-size:14px;margin-bottom:12px}
.top{margin-bottom:10px;font-size:14px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:14px 0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px}
.ex h3{font-size:17px;margin:0}
.chk{font:inherit;font-size:14px;padding:4px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;flex:none}
.btns{display:flex;gap:8px;flex:none}
.chk:hover{border-color:var(--acc);color:var(--acc)}
.instr{margin:0 0 6px;font-weight:500}
.hint{margin:0 0 6px;color:var(--soft);font-size:14px}
.bank{margin:0 0 8px;padding:6px 10px;border:1px dashed var(--line);border-radius:6px;font-size:14px}
.bsp{margin:0 0 10px;padding:6px 10px;background:var(--bg);border-left:3px solid var(--acc);font-size:14.5px;white-space:pre-line}
ol{list-style:none;margin:0;padding:0}
li{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line);align-items:baseline}
li:first-child{border-top:0}
.l{flex:0 0 1.6em;color:var(--soft);font-weight:600}
.body{flex:1;min-width:0}
.q{margin-bottom:3px}
input.f{font:inherit;color:var(--ink);background:var(--fld);border:0;border-bottom:1.5px solid var(--soft);padding:1px 4px;min-width:0}
input.f:focus{outline:0;border-bottom-color:var(--acc);background:var(--bg)}
input.full{display:block;width:100%}
input.s{width:7em}input.m{width:13em}input.w{width:22em;max-width:100%}
.sol{display:none;margin-top:4px;padding:4px 10px;background:var(--okbg);border-left:3px solid var(--ok);color:var(--ok);font-size:15px;white-space:pre-line}
.ex.show li.filled .sol{display:block}
.pager{display:flex;justify-content:space-between;margin:28px 0 8px;font-size:15px}
.idx a{display:block;padding:10px 14px;margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink)}
.idx a:hover{border-color:var(--acc);color:var(--acc)}
.idx small{color:var(--soft);margin-left:8px}
@media print{.chk,.top,.pager{display:none}.sol{display:none!important}.ex{break-inside:avoid}body{background:#fff;color:#000}input.f{background:#fff}}
</style></head><body><main>
<div class="top"><a href="index.html">← Übersicht</a></div>
<h1>Wortarten</h1>
<div class="sub">Übungsgrammatik für die Mittelstufe C1. „Check“ zeigt eine Lösung unter jeder Antwort. Die Lösungen stammen aus dem Lösungsteil des Buches. Antworten werden im Browser gespeichert.</div>
<div id="root"></div>
<div class="pager"><span></span><span></span></div>
</main>
<script>
const C={"id":"wortarten","name":"Wortarten","ex":[{"t":"1 Wortarten · Übung 1 (Seite 8)","i":"","hint":"Die Aufgabenstellung ist im gescannten Buch nicht lesbar; laut Lösungsheft wird zu jedem Wort des Textes die Wortart bestimmt. Die ersten fünf Wörter (Kostas, pumpt, mich, oft, an) sind im Buch vorgegeben.","bsp":"Kostas pumpt mich oft an, denn mit dem Geld, das sein Vater ihm monatlich überweist, kommt er nie aus. Es reicht nur bis zur Mitte des Monats. Aber Kostas braucht auch Geld für die zweite Monatshälfte. Deshalb, und weil er auf sein Auto nicht verzichten will, muss er sich etwas dazu verdienen - oder manchmal einen Freund anpumpen.\n\nVorgegeben: Kostas: Nomen (Eigenname) · pumpt: Verb · mich: Personalpronomen · oft: Adverb · an: Präposition (hier: Präfix)","items":["denn","mit","dem","Geld","das","sein","Vater","ihm","monatlich","überweist","kommt","er","nie","aus","es","reicht","nur","bis","zur","Mitte","des","Monats","Aber","Kostas","braucht","auch","Geld","für","die","zweite","Monatshälfte","Deshalb","und","weil","er","auf","sein","Auto","nicht","verzichten","will","muss","er","sich","etwas","dazuverdienen","oder","manchmal","einen","Freund","anpumpen"],"sol":["Konjunktion","Präposition","bestimmter Artikel","Nomen","Relativpronomen","Possessivartikel","Nomen","Personalpronomen","Adjektiv","Verb","Verb","Personalpronomen","Adverb","Präposition / Verbzusatz","Personalpronomen","Verb","Adverb","Präposition","Präposition + best. Artikel","Nomen","bestimmter Artikel","Nomen","Konjunktion","Nomen / Eigenname","Verb","Adverb","Nomen","Präposition","bestimmter Artikel","Adjektiv / Ordinalzahl","Nomen","Adverb","Konjunktion","Subjunktion","Personalpronomen","Präposition","Possessivartikel","Nomen","Adverb","Verb","Verb / Modalverb","Verb / Modalverb","Personalpronomen","Reflexivpronomen","Indefinitpronomen","Verb","Konjunktion","Adverb","unbestimmter Artikel","Nomen","Verb"]}]};

const root=document.getElementById('root');
let store={};const KEY="ubungsgrammatik-mittelstufe-c1-antworten";
try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
function field(id,cls){
  const i=mk('input','f '+cls);i.type='text';i.autocomplete='off';i.spellcheck=false;
  i.value=store[id]||'';
  i.oninput=()=>{if(i.value)store[id]=i.value;else delete store[id];save()};
  return i;
}
C.ex.forEach((e,ei)=>{
  const box=mk('section','ex');
  const head=mk('div','head');head.appendChild(mk('h3',null,e.t));
  const btn=mk('button','chk','Check');btn.type='button';
  btn.onclick=()=>{const on=box.classList.toggle('show');btn.textContent=on?'Verbergen':'Check'};
  const rst=mk('button','chk','Reset');rst.type='button';
  // Reset clears every field of this exercise (and its saved answers) via the normal input handlers
  rst.onclick=()=>box.querySelectorAll('input.f').forEach(i=>{if(i.value){i.value='';i.dispatchEvent(new Event('input',{bubbles:true}))}});
  const btns=mk('div','btns');btns.appendChild(btn);btns.appendChild(rst);
  head.appendChild(btns);box.appendChild(head);
  if(e.i)box.appendChild(mk('p','instr',e.i));
  if(e.hint)box.appendChild(mk('p','hint',e.hint));
  if(e.bank)box.appendChild(mk('div','bank',e.bank));
  if(e.bsp)box.appendChild(mk('div','bsp',e.bsp));
  const ol=mk('ol');
  e.items.forEach((it,k)=>{
    const li=mk('li');
    li.appendChild(mk('span','l',String.fromCharCode(97+k%26)+')'));
    const b=mk('div','body');
    const base=C.id+'-'+ei+'-'+k;
    let n=0;
    it.split('\n').forEach(ln=>{
      const q=mk('div','q');
      ln.split(/(_{3,})/).forEach(p=>{
        if(/^_{3,}$/.test(p))q.appendChild(field(base+'-'+(n++),p.length>=5?'w':p.length===4?'m':'s'));
        else if(p)q.appendChild(document.createTextNode(p));
      });
      b.appendChild(q);
    });
    if(n===0)b.appendChild(field(base,'full'));
    b.appendChild(mk('div','sol',e.sol[k]));
    li.appendChild(b);ol.appendChild(li);
  });
  // Check shows a solution only under items that have an answer: li.filled = at least one non-empty field
  const upd=li=>li.classList.toggle('filled',[...li.querySelectorAll('input')].some(i=>i.value.trim()));
  box.addEventListener('input',ev=>{const li=ev.target.closest('li');if(li)upd(li)});
  ol.querySelectorAll('li').forEach(upd);
  box.appendChild(ol);root.appendChild(box);
});
</script></body></html>
