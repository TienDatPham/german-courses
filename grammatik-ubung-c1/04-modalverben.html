<h1>Modalverben</h1>
<div class="sub">Grammatikübungen C1. „Check“ zeigt eine Lösung unter jeder Antwort. Die Lösungen sind selbst erstellt, nicht aus dem Buch. Bei offenen Aufgaben sind auch andere richtige Antworten möglich. Antworten werden im Browser gespeichert.</div>

<script>
const C={"id":"modal","name":"Modalverben","ex":[{"theory":["Es gibt einige Verben, die in Verbindung mit einem Infinitiv ohne zu stehen können.","> Max ließ sich neue Möbel machen. / Jana wollte das Büro aufräumen. / Clara sah mich wegfahren.","Auch die sechs Modalverben zählen zu dieser Gruppe von Verben. Im Hauptsatz stehen die Modalverben an Position II. Das Vollverb steht am Ende im Infinitiv ohne zu.","Mit den Modalverben modifiziert man, was man im Infinitiv aussagt.","> Ich fahre morgen mit.","> Ich kann / darf / muss / soll / will / mag morgen mitfahren.","Im Präsens konjugiert man die Modalverben - außer sollen - mit einem Vokalwechsel.","|^|können|dürfen|müssen|mögen|wollen|sollen","|ich|kann|darf|muss|mag|will|soll","|du|kannst|darfst|musst|magst|willst|sollst","|er, sie, es|kann|darf|muss|mag|will|soll","|wir|können|dürfen|müssen|mögen|wollen|sollen","|ihr|könnt|dürft|müsst|mögt|wollt|sollt","|sie|können|dürfen|müssen|mögen|wollen|sollen","Das Präteritum bildet man bei allen Modalverben ohne Umlaut.","|^Präsens|Präteritum|Präsens|Präteritum","|ich kann|ich konnte|ich mag|ich mochte","|ich darf|ich durfte|ich will|ich wollte","|ich muss|ich musste|ich soll|ich sollte","Perfekt und Plusquamperfekt bildet man bei Modalverben mit haben (Position II) und Infinitiv (ENDE).","|Perfekt|Sie hat die Aufgabe lösen können.","|Plusquamperfekt|Sie hatte die Aufgabe lösen können.","Wenn der Kontext klar ist, kann man den Infinitiv weglassen. Das Perfekt/Plusquamperfekt bildet man dann mit dem Partizip II des Modalverbs. (selten)","> Du hast meine Vase zerbrochen! - Tut mir leid, das habe ich nicht gewollt.","Modalverben können verschiedene Bedeutungen haben.","> Krokodile können lange tauchen. > Krokodile haben die Fähigkeit[,] lange zu tauchen.","> Man kann sich telefonisch anmelden. > Man hat die Möglichkeit[,] sich telefonisch anzumelden.","**Grundsätzlich unterscheidet man bei Modalverben zwei Bedeutungsgruppen:**","|^objektiver Gebrauch - Grundbedeutungen|subjektiver Gebrauch - sprecherverbunden","|Mit Modalverben kann man bestimmte Tatsachen, Realitäten, Aspekte beschreiben.¶Sie **muss** die Arbeit erledigen.¶> Sie hat die Pflicht[,] die Arbeit zu erledigen.¶Man verwendet hier alle Zeitformen der Modalverben.¶Sie muss die Arbeit erledigen.¶Sie musste die Arbeit erledigen.¶Sie hat die Arbeit erledigen müssen.¶Sie hatte die Arbeit erledigen müssen.¶Sie wird die Arbeit erledigen müssen.¶Sie wird die Arbeit haben erledigen müssen.¹|Mit den Modalverben kann ein Sprecher seine Meinung, seine Einschätzung ausdrücken.¶Er **müsste** bald ankommen.¶> Ich bin mir fast sicher, dass er bald ankommt.¶Dieser Satz zeigt, dass der Sprecher eine bestimmte Meinung über ein Geschehen, eine Situation etc. hat (er ist sich fast sicher). Seine Meinung kann die Gegenwart/das Futur oder die Vergangenheit betreffen.¶Er müsste bald ankommen.¶Er müsste sich erinnern.¶Er müsste schon angekommen sein.¶Er müsste sich erinnert haben.","~ 1) Das Futur II mit Modaklverben ist kaum gebräuchlich. Es finden sich in Grammatikbeschreibungenn auch unterschiedliche Varianten: * Sie wird die Arbeit haben erledigen müssen.","## 1. Die Grundbedeutungen der Modalverben (objektiver Gebrauch)","Modalverben kann man gebrauchen, um Tatsachen, Realitäten etc. auszudrücken.","> Man muss alle Maschinen kontrollieren.","> Man musste alle Maschinen kontrollieren. / Man hat alle Maschinen kontrollieren müssen.","|^Bedeutung|Modalverb|Umschreibungen (z. B.)","|**Fähigkeit/Talent**¶Sie kann gut Schach spielen.¶**Möglichkeit/Gelegenheit**¶Ich kann dich finanziell unterstützen.¶**Erlaubnis**¶Du kannst mein Fahrrad nehmen.|können|in der Lage/imstande¹/fähig sein¶beherrschen/vermögen/es fertig bringen¶sich verstehen aufs (z. B. aufs Angeln)¶die Gelegenheit/die Chance haben¶die Aussicht/die Möglichkeit haben¶man bietet jemandem an¶es ist jemandem möglich¶man hat jemandem gestattet/erlaubt¶jemand hat die Erlaubnis","|**Unfähigkeit/Unvermögen**¶Ich kann dir nicht helfen.|können nicht/kein|außerstande sein¹","|**Möglichkeit**¶Er hat den Test geschafft. Du darfst ihm gratulieren.¶**Erlaubnis/Genehmigung**¶In diesem Zimmer dürfen Sie rauchen.|dürfen|die Möglichkeit/die Gelegenheit haben¶die Genehmigung/das Recht haben¶die Bewilligung/die Zulassung erhalten¶man hat jemandem gestattet/erlaubt¶es ist zulässig","|**Verbot**¶Diesen Raum dürfen Sie nicht betreten.¶**Notwendigkeit** mit Negation¶Im Labor darf kein Fehler passieren.|dürfen nicht/kein|man verbietet/untersagt jemandem¶man hat jemandem verboten/untersagt¶es ist wichtig, (dass man) nicht/kein¶es ist zu vermeiden","|**eigener Wille/Absicht/Intention**¶Sie will ihm zum Geburtstag eine Reise schenken.¶**Bereitschaft**¶Ich will dir gerne helfen.|wollen|die Absicht/den Plan haben/planen¶vorhaben/beabsichtigen/anstreben¶bereit sein/geneigt sein¶die Bereitschaft zeigen","|**Widerwille**¶Er will diese Arbeit auf keinen Fall erledigen.|wollen nicht/kein|jemand weigert sich/lehnt es ab","|**Vorliebe/Lust**¶Ich mag spazieren gehen.|mögen|Lust haben¶eine Vorliebe haben für","|keine **Lust**¶Ich mag nicht mehr lernen.|mögen nicht/kein|keine Lust haben¶keine Vorliebe haben für","|**Wunsch/Lust**¶Er möchte jetzt ins Kino gehen.¶**höfliche Bitte** (fremder Wille)¶Er sagt, du möchtest doch kommen.|mögen (Konjunktiv II)|gedenken/wünschen/vorhaben, beabsichtigen/würde gerne¶man bittet/ersucht jemanden","|**Befehl/strikte Anweisung/Anordnung** (fremder Wille)¶Du musst sofort nach Hause kommen.¶**Notwendigkeit/Pflicht/Vorschrift**¶Er muss jeden Tag um 6.00 Uhr aufstehen.|müssen|jemand hat den Befehl/die Anweisung¶man verlangt von jemandem¶man befiehlt jemandem¶jemand hat zu ...¶es ist notwendig/nötig/unerlässlich¶es ist wichtig/erforderlich/vorgeschrieben¶man ist verpflichtet/man zwingt jemanden","|keine **Notwendigkeit**¶Am Samstag muss ich nicht aufstehen.|müssen nicht/kein|es ist nicht notwendig/erforderlich etc.¶Man braucht nicht .... zu ...","|**Anordnung/Auftrag** (fremder Wille)¶Du sollst dein Zimmer aufräumen.¶**Pflicht** (moralisch)/**Gebot**¶Du sollst nicht töten!|sollen|jemand hat die Aufgabe/den Auftrag¶man fordert jemanden auf¶man erwartet von dir, dass ...¶es gibt das Gebot, dass ...","~ 1) auch: im Stande, außer Stande"]},{"t":"1 Grundbedeutungen (objektiver Gebrauch) · Übung 1","i":"Bilden Sie Sätze mit Modalverb.","items":["Man erlaubte den Kindern, bis 10.00 Uhr fernzusehen.","Man forderte uns dazu auf, Beweise für unsere Beschuldigungen vorzulegen.","Sie haben die Möglichkeit, die Buchung jederzeit zu stornieren.","Es ist notwendig, die Geheimnummer zu ändern.","Sie bekam die Anweisung, alle Listen neu zu schreiben.","Es ist unmöglich, diese Vorschläge zu akzeptieren.","Sie haben das Recht, die Aussage zu verweigern.","Man erlaubte uns nicht, in den Firmenräumen zu fotografieren.","Er ist außerstande, deine Fragen zu beantworten.","Sie hatte die Absicht, ihm eine Karte zu schreiben.","Er verlangte, den Geschäftsführer zu sprechen.","Ich hatte die Möglichkeit, kurz mit ihm zu reden.","Wir hatten die Aufgabe, die Konferenz vorzubereiten.","Es ist sehr wichtig, dass du dich nicht verspätest.","Ist es gestattet, dass ich mich zu Ihnen setze?","Julia ist nicht in der Lage, sich um alles zu kümmern.","Sie hatte vor, den Laden zu verkaufen.","Er hatte keine Genehmigung, die Akten zu kopieren.","Der kleine Junge war nicht imstande, den schweren Kasten zu tragen.","Sie beabsichtigte, ihren alten Schrank restaurieren zu lassen.","Ich hatte keine Lust, die ganze Wohnung alleine aufzuräumen.","Es ist verboten, diese gefährlichen Chemikalien zu exportieren.","Man gab ihm die Gelegenheit, sich zu den Anschuldigungen zu äußern.","Ich weigerte mich, Auskunft darüber zu geben.","Man gab ihr den Auftrag, die Kosten des Projekts zu berechnen.","Es ist wichtig, den Flug frühzeitig zu buchen."],"bsp":"Beispiel: Er ist nicht fähig, sich länger zu konzentrieren. → Er kann sich nicht länger konzentrieren.","sol":["Die Kinder durften bis 10.00 Uhr fernsehen.","Wir sollten Beweise für unsere Beschuldigungen vorlegen.","Sie können die Buchung jederzeit stornieren.","Man muss die Geheimnummer ändern.","Sie sollte alle Listen neu schreiben.","Man kann diese Vorschläge nicht akzeptieren.","Sie dürfen die Aussage verweigern.","Wir durften in den Firmenräumen nicht fotografieren.","Er kann deine Fragen nicht beantworten.","Sie wollte ihm eine Karte schreiben.","Er wollte den Geschäftsführer sprechen.","Ich konnte kurz mit ihm reden.","Wir sollten die Konferenz vorbereiten.","Du darfst dich nicht verspäten.","Darf ich mich zu Ihnen setzen?","Julia kann sich nicht um alles kümmern.","Sie wollte den Laden verkaufen.","Er durfte die Akten nicht kopieren.","Der kleine Junge konnte den schweren Kasten nicht tragen.","Sie wollte ihren alten Schrank restaurieren lassen.","Ich wollte die ganze Wohnung nicht alleine aufräumen.","Man darf diese gefährlichen Chemikalien nicht exportieren.","Er durfte sich zu den Anschuldigungen äußern.","Ich wollte darüber keine Auskunft geben.","Sie sollte die Kosten des Projekts berechnen.","Man muss den Flug frühzeitig buchen."]},{"theory":["Mit **haben zu + Infinitiv** kann man eine Notwendigkeit ausdrücken. Sätze mit haben zu kann man in aktive Sätze mit müssen oder nicht dürfen umwandeln.","> Etwas hat zu geschehen. > Etwas muss geschehen.","> Etwas hat nicht zu geschehen. > Etwas darf nicht geschehen.","In bestimmten Zusammenhängen drückt man mit haben zu auch einen Wunsch oder eine Absicht aus.","> Ich habe dir etwas zu sagen. > Ich will/möchte dir etwas sagen."]},{"t":"1 Grundbedeutungen (objektiver Gebrauch) · Übung 2","i":"","items":["Alle haben die Regeln zu beachten.","Niemand hat sich von der Gruppe zu entfernen.","Ich habe dir für all deine Unterstützung zu danken.","Aufgrund des Streiks hat man mit Verspätungen zu rechnen.","Sie haben auf alle Fragen wahrheitsgemäß zu antworten.","Die Soldaten haben dem Offizier nicht zu widersprechen.","Man hat die Geräte regelmäßig zu warten.","Ich hatte leider noch viel zu erledigen.","Der Sportler hatte streng auf sein Gewicht zu achten.","Du hast mit niemandem über diese Angelegenheit zu sprechen.","Worauf hast du dich bei diesem Projekt zu konzentrieren?","Wogegen hat man sich vor dieser Reise impfen zu lassen?","Dazu habe ich nichts zu sagen."],"bsp":"Beispiel: Er hatte sich beim Chef zu melden. → Er musste sich beim Chef melden.","sol":["Alle müssen die Regeln beachten.","Niemand darf sich von der Gruppe entfernen.","Ich muss dir für all deine Unterstützung danken.","Aufgrund des Streiks muss man mit Verspätungen rechnen.","Sie müssen auf alle Fragen wahrheitsgemäß antworten.","Die Soldaten dürfen dem Offizier nicht widersprechen.","Man muss die Geräte regelmäßig warten.","Ich musste leider noch viel erledigen.","Der Sportler musste streng auf sein Gewicht achten.","Du darfst mit niemandem über diese Angelegenheit sprechen.","Worauf musst du dich bei diesem Projekt konzentrieren?","Wogegen muss man sich vor dieser Reise impfen lassen?","Dazu kann ich nichts sagen."]},{"theory":["## 2. Die sprecherbezogene Bedeutung der Modalverben (subjektiver Gebrauch)","Mithilfe von Modalverben kann ein Sprecher seine Meinung, seine Einschätzung etc. ausdrücken.","> Er müsste sich erinnern > Ich bin mir fast sicher, dass er sich erinnert.","> Du solltest dich gesünder ernähren. > Ich halte es für besser, dass du dich gesünder ernährst.","In diesen Kontexten kann also das Modalverb z. B. zeigen, wie sicher der Sprecher etwas weiß oder zu wissen glaubt oder was er für empfehlenswert hält etc.","### 1. Gruppe","Wenn eine Vermutung, eine Schlussfolgerung etc. einen Vorgang, eine Situation in der Gegenwart oder in der Zukunft betrifft, gebraucht man den **Infinitiv Präsens**","> Er sagt: „Ich bin sicher, dass Eva zu Hause ist.“ > „Eva muss zu Hause sein.“","> Er sagt: „Vielleicht regnet es morgen“ > „Morgen könnte es regnen.“","Wenn eine Vermutung, eine Schlussfolgerung etc. einen Vorgang, eine Situation in der Vergangenheit betrifft, gebraucht man den **Infinitiv Perfekt** (Infinitiv Vergangenheit).","> Er sagt: „Ich bin sicher, dass Eva in Rom war.“ > „Eva muss in Rom gewesen sein.“","> Er sagt: „Vielleicht hat sich dein Kollege geirrt.“ > „Dein Kollege könnte sich geirrt haben.“","Den Infinitiv Perfekt bildet man mit dem Partizip II und den Hilfsverben haben oder sein.","> sagen > gesagt haben","> bleiben > geblieben sein","|^Bedeutung|Modalverb|Umschreibungen (z. B.)","|**Vermutung/Ungewissheit/Hypothese**¶Er könnte/kann den Bus verpasst haben.|können (meist Konjunktiv II)|vielleicht, unter Umständen, womöglich¶eventuell, möglicherweise, es wird wohl","|**Vermutung/Annahme**¶Die Wohnung mag 600.- € Miete kosten.|mögen (selten)|vielleicht, unter Umständen,¶möglicherweise, eventuell","|**Vermutung**¶Heute Abend dürfte es noch regnen.|dürfen (Konjunktiv II)|wahrscheinlich, vermutlich,¶ich glaube, ich nehme an, ich befürchte","|**Schlussfolgerung** (fast sicher)¶Sie müsste bald ankommen.|müssen (Konjunktiv II)|fast sicher, beinahe sicher,¶ziemlich sicher","|**Schlussfolgerung** (sicher)¶Sie muss gestern zu Hause gewesen sein.|müssen|bestimmt, sicher, gewiss","|**Schlussfolgerung** mit Negation (sicher)¶Sie kann nicht zu Hause gewesen sein.|können nicht/kein|bestimmt nicht, sicher nicht,¶gewiss nicht","|**Gerücht/kritische Distanz** (Information aus zweiter Hand)¶Paul soll den Unfall genau gesehen haben.|sollen|ich habe gehört/gelesen, dass ...¶man sagt/erzählt, dass ...¶man hat gesagt, dass .../es heißt, dass ...¶angeblich","|**kritische Stellungnahme** (Zweifel)¶Paul will den Unfall genau gesehen haben.|wollen|jemand behauptet, dass er ...¶jemand erklärt/sagt, dass er ...¶jemand gibt vor, dass er ...","### 2. Gruppe","Bei einem Rat/bei einer Empfehlung gebraucht man den **Konj. II Präs.** von sollen / müssen. Das Vollverb steht im Infinitiv Präsens. z. B. Du solltest dich gut vorbereiten. Man gebraucht müsste, wenn man davon ausgeht, dass der Rat nicht befolgt wird.","> Er müsste endlich mit dem Rauchen aufhören.","Bei nachträglichen Feststellungen gebraucht man den **Konj. II Verg.** von sollen / müssen / dürfen + Negat. Das Vollverb steht im Infinitiv Präsens. z. B. Du hättest dich besser vorbereiten sollen/müssen.","|^Bedeutung|Modalverb|Umschreibungen (z. B.)","|**Empfehlung/Rat**¶Du solltest mehr auf deine Gesundheit achten.¶Du müsstest mehr auf deine Gesundheit achten.|sollen¶müssen¶(Konjunktiv II)|Es wäre besser ratsam ...¶Ich empfehle/rate dir ...¶Ich halte es für besser/ratsam ...","|**nachträgliche Feststellung/Bedauern**¶Das hätte er (nicht) machen sollen.¶Das hättest du wissen müssen. (ohne Negation)¶Das hätte nicht passieren dürfen. (mit Negation)|sollen¶müssen¶dürfen¶(Konjunktiv II - Verg.)|Es wäre besser gewesen, wenn ...¶Es wäre besser gewesen, ... zu ..."]},{"t":"2 Sprecherbezogene Bedeutung (subjektiver Gebrauch) · Übung 3","i":"Bilden Sie Sätze mit Modalverben.","items":["Ich vermute, dass sie euch belogen hat.","Gegen diese Reformen protestieren wahrscheinlich viele.","Unter Umständen irrst du dich.","Ich glaube, dass Paul damals schon in München gewohnt hat.","Es ist denkbar, dass sie umgezogen ist.","Der Autofahrer war womöglich betrunken."],"hint":"Vermutung (könnte/dürfte)","sol":["Sie dürfte euch belogen haben.","Gegen diese Reformen dürften viele protestieren.","Du könntest dich irren.","Paul dürfte damals schon in München gewohnt haben.","Sie könnte umgezogen sein.","Der Autofahrer könnte betrunken gewesen sein."]},{"t":"2 Sprecherbezogene Bedeutung (subjektiver Gebrauch) · Übung 4","i":"Bilden Sie Sätze mit Modalverben.","items":["Sie hat dich bestimmt falsch verstanden.","Sie hat zweifellos nicht lange gewartet.","Ich bin relativ sicher, dass du die Stelle bekommst.","Zweifellos wohnt sie in einem sehr luxuriösen Haus.","Sein Onkel ist ziemlich sicher schon über achtzig Jahre alt.","Ich bin mir sicher, dass er die Tür nicht abgeschlossen hat."],"hint":"Schlussfolgerung (müsste/muss \u003c> kann nicht/kein)","sol":["Sie muss dich falsch verstanden haben.","Sie kann nicht lange gewartet haben.","Du müsstest die Stelle bekommen.","Sie muss in einem sehr luxuriösen Haus wohnen.","Sein Onkel dürfte schon über achtzig Jahre alt sein.","Er kann die Tür nicht abgeschlossen haben."]},{"t":"2 Sprecherbezogene Bedeutung (subjektiver Gebrauch) · Übung 5","i":"Bilden Sie Sätze mit Modalverben.","items":["Angeblich hat ihn sein Vetter neulich besucht.","Man erzählt, dass es in der Schillerstraße gebrannt hat.","In der Zeitung steht, dass man eine Leiche entdeckt hat.","Man sagt, dass Paula von ihrer Tante ein Haus geerbt hat.","Angeblich steckt die Firma in finanziellen Schwierigkeiten.","Ich habe gehört, dass dieses Restaurant sehr schlecht ist."],"hint":"kritische Distanz - Gerücht - Information aus zweiter Hand (soll)","sol":["Sein Vetter soll ihn neulich besucht haben.","In der Schillerstraße soll es gebrannt haben.","Man soll eine Leiche entdeckt haben.","Paula soll von ihrer Tante ein Haus geerbt haben.","Die Firma soll in finanziellen Schwierigkeiten stecken.","Dieses Restaurant soll sehr schlecht sein."]},{"t":"2 Sprecherbezogene Bedeutung (subjektiver Gebrauch) · Übung 6","i":"Bilden Sie Sätze mit Modalverben.","items":["„Ich habe den Unfall genau gesehen.“","„Ich bin an jenem Abend zufällig in diese Kneipe gekommen.“","„Ich kenne den Angeklagten nicht.“","„Ich habe alles beobachtet.“","„Ich bin schon oft diese Strecke gefahren.“","„Plötzlich habe ich einen Schuss gehört.“","„Ich kann mich nicht mehr genau erinnern.“"],"hint":"kritische Stellungnahme - bezweifelte Behauptung (will). Der Zeuge behauptet etwas, aber man ist nicht sicher, ob er die Wahrheit spricht:","bsp":"Beispiel: „Ich habe ein Geräusch gehört.“ → Der Zeuge will ein Geräusch gehört haben.","sol":["Der Zeuge will den Unfall genau gesehen haben.","Der Zeuge will an jenem Abend zufällig in diese Kneipe gekommen sein.","Der Zeuge will den Angeklagten nicht kennen.","Der Zeuge will alles beobachtet haben.","Der Zeuge will schon oft diese Strecke gefahren sein.","Der Zeuge will plötzlich einen Schuss gehört haben.","Der Zeuge will sich nicht mehr genau erinnern können."]},{"t":"2 Sprecherbezogene Bedeutung (subjektiver Gebrauch) · Übung 7","i":"Bilden Sie Sätze mit Modalverben.","items":["Ich rate dir, nicht so viel Alkohol zu trinken.","Es ist empfehlenswert, sich vor der Reise impfen zu lassen.","Ich empfehle Ihnen, sich einen guten Anwalt zu nehmen.","Ich halte es für besser, wenn Sie mit dem Rauchen aufhören.","Ich gebe euch den guten Rat, keine Zeit zu verlieren.","Es ist empfehlenswert, alle wichtigen Dateien doppelt zu sichern."],"hint":"Empfehlung (sollte/müsste)","sol":["Du solltest nicht so viel Alkohol trinken.","Man sollte sich vor der Reise impfen lassen.","Sie sollten sich einen guten Anwalt nehmen.","Sie sollten mit dem Rauchen aufhören.","Ihr solltet keine Zeit verlieren.","Man sollte alle wichtigen Dateien doppelt sichern."]},{"t":"2 Sprecherbezogene Bedeutung (subjektiver Gebrauch) · Übung 8","i":"Bilden Sie Sätze mit Modalverben.","items":["Es wäre besser gewesen, wenn er einen Experten gefragt hätte.","Es wäre besser gewesen, wenn ich zum Zahnarzt gegangen wäre.","Es wäre besser gewesen, wenn man an die Folgen gedacht hätte.","Es wäre besser gewesen, wenn er nicht gekündigt hätte.","Es wäre besser gewesen, wenn sie die Wahrheit gesagt hätte.","Es wäre besser gewesen, wenn du nicht auf diesen Rat gehört hättest."],"hint":"nachträgliche Feststellung - Bedauern (hätte ... sollen/müssen \u003c> dürfen)","sol":["Er hätte einen Experten fragen sollen.","Ich hätte zum Zahnarzt gehen sollen.","Man hätte an die Folgen denken sollen.","Er hätte nicht kündigen dürfen.","Sie hätte die Wahrheit sagen sollen.","Du hättest nicht auf diesen Rat hören dürfen."]},{"theory":["## 3. Vorgangspassiv mit Modalverben","|^Aktiv - objektive Bedeutungen|Passiv - objektive Bedeutungen","|Der Zeuge kann den Bericht bestätigen.¶Man musste den Bericht überprüfen¶Man hat den Bericht veröffentlichen dürfen.|Der Bericht kann vom Zeugen bestätigt werden.¶Der Bericht musste überprüft werden.¶Der Bericht hat veröffentlicht werden dürfen.","> Man muss den Zaun bald reparieren. > Der Zaun muss bald repariert werden.","> Man soll die Tür immer abschließen. > Die Tür soll immer abgeschlossen werden.","> Man kann die Rechnung überweisen. > Die Rechnung kann überwiesen werden.","> Man darf die Kameras nicht mitnehmen. > Die Kameras dürfen nicht mitgenommen werden.","> Man will / möchte den Termin verschieben. > Der Termin soll verschoben werden.","Im Aktiv wollen/möchten (eigener Wille) kann man im Passiv nur sinngemäß durch sollen ersetzen.","> Man will den Ablauf komplett umorganisieren. > Der Ablauf soll komplett umorganisiert werden."]},{"t":"3 Vorgangspassiv mit Modalverben · Übung 9","i":"(objektive Modalverben) Bilden Sie Sätze im Vorgangspassiv.","items":["Man kann die Reihenfolge nicht verändern.","Man muss ihm immer alles zweimal erklären.","Die Mitarbeiter dürfen die Pläne nicht weitergeben.","Niemand konnte diese Thesen widerlegen.","Die Experten sollten die Risiken aufzeigen.","Man konnte den Aufenthalt nicht verlängern.","Niemand durfte den Raum betreten.","Man will den Versuch wiederholen.","Man wollte die Leute nicht beunruhigen.","Max wollte die Angelegenheit schnell erledigen."],"bsp":"Beispiel: Man konnte den Fehler beheben. → Der Fehler konnte behoben werden.","sol":["Die Reihenfolge kann nicht verändert werden.","Ihm muss immer alles zweimal erklärt werden.","Die Pläne dürfen von den Mitarbeitern nicht weitergegeben werden.","Diese Thesen konnten von niemandem widerlegt werden.","Die Risiken sollten von den Experten aufgezeigt werden.","Der Aufenthalt konnte nicht verlängert werden.","Der Raum durfte von niemandem betreten werden.","Der Versuch soll wiederholt werden.","Die Leute sollten nicht beunruhigt werden.","Die Angelegenheit sollte von Max schnell erledigt werden."]},{"theory":["|^Aktiv - subjektive Bedeutungen|Passiv - subjektive Bedeutungen","|Der Kollege könnte den Fehler bemerken.¶Man müsste den Fehler gefunden haben.|Der Fehler könnte vom Kollegen bemerkt werden.¶Der Fehler müsste gefunden worden sein."]},{"t":"3 Vorgangspassiv mit Modalverben · Übung 10","i":"(subjektive Modalverben) Bilden Sie Passivsätze mit Modalverb.","items":["Vermutlich repariert man den Automaten bis morgen.","Sicherlich hat man ihn eingeladen.","Wahrscheinlich glaubt man ihr.","Vielleicht hat man euch betrogen.","Solche Fehler übersieht man bestimmt nicht.","Man nimmt uns vielleicht mit.","Angeblich baut man hier demnächst eine neue Straße.","Vielleicht hat man dich erkannt."],"bsp":"Beispiele: Vielleicht ändert man den Termin. (Präsens/Futur)\nMan könnte den Termin ändern. → Der Termin könnte geändert werden.\nWahrscheinlich hat man die Leute informiert. (Vergangenheit)\nMan dürfte die Leute informiert haben. → Die Leute dürften informiert worden sein.","sol":["Der Automat dürfte bis morgen repariert werden.","Er muss eingeladen worden sein.","Ihr dürfte geglaubt werden.","Ihr könntet betrogen worden sein.","Solche Fehler dürften nicht übersehen werden.","Wir könnten mitgenommen werden.","Hier soll demnächst eine neue Straße gebaut werden.","Du könntest erkannt worden sein."]}]};

const root=document.getElementById('root');
let store={};const KEY="grammatik-c1-antworten";
try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
function field(id,cls){
  const i=mk('input','f '+cls);i.type='text';i.autocomplete='off';i.spellcheck=false;
  i.value=store[id]||'';
  i.oninput=()=>{if(i.value)store[id]=i.value;else delete store[id];save()};
  return i;
}
const rich=(el,t)=>t.split(/(\*\*[^*]+\*\*)/).forEach(p=>{if(/^\*\*[^*]+\*\*$/.test(p))el.appendChild(mk('b',null,p.slice(2,-2)));else if(p)el.appendChild(document.createTextNode(p))});
function theory(lines){
  const box=mk('section','theory');let tb=null;
  lines.forEach(l=>{
    if(l[0]==='|'){
      if(!tb){const w=mk('div','tbw');tb=mk('table');w.appendChild(tb);box.appendChild(w)}
      const h=l[1]==='^';const tr=mk('tr');
      l.slice(h?2:1).split('|').forEach(c=>{const td=mk(h?'th':'td');c.split('¶').forEach((p,i)=>{if(i)td.appendChild(mk('br'));rich(td,p.trim())});tr.appendChild(td)});
      tb.appendChild(tr);return;
    }
    tb=null;
    let el;
    if(l.startsWith('## ')){el=mk('h2');rich(el,l.slice(3))}
    else if(l.startsWith('### ')){el=mk('h3');rich(el,l.slice(4))}
    else if(l.startsWith('> ')){el=mk('div','eg');rich(el,l.slice(2))}
    else if(l.startsWith('~ ')){el=mk('div','note');rich(el,l.slice(2))}
    else if(l.startsWith('- ')){el=mk('div','li');rich(el,l)}
    else{el=mk('p');rich(el,l)}
    box.appendChild(el);
  });
  root.appendChild(box);
}
let xi=0;
C.ex.forEach(e=>{
  if(e.theory){theory(e.theory);return}
  const ei=xi++;
  const box=mk('section','ex');
  const head=mk('div','head');head.appendChild(mk('h3',null,e.t));
  const btn=mk('button','chk','Check');btn.type='button';
  btn.onclick=()=>{const on=box.classList.toggle('show');btn.textContent=on?'Verbergen':'Check'};
  const rst=mk('button','chk','Reset');rst.type='button';
  // Reset clears every field of this exercise (and its saved answers) via the normal input handlers
  rst.onclick=()=>box.querySelectorAll('input.f').forEach(i=>{if(i.value){i.value='';i.dispatchEvent(new Event('input',{bubbles:true}))}});
  const btns=mk('div','btns');btns.appendChild(btn);btns.appendChild(rst);
  head.appendChild(btns);box.appendChild(head);
  if(e.i)box.appendChild(mk('p','instr',e.i));
  if(e.hint)box.appendChild(mk('p','hint',e.hint));
  if(e.bank)box.appendChild(mk('div','bank',e.bank));
  if(e.bsp)box.appendChild(mk('div','bsp',e.bsp));
  const ol=mk('ol');
  e.items.forEach((it,k)=>{
    const li=mk('li');
    li.appendChild(mk('span','l',String.fromCharCode(97+k%26)+')'));
    const b=mk('div','body');
    const base=C.id+'-'+ei+'-'+k;
    let n=0;
    it.split('\n').forEach(ln=>{
      const q=mk('div','q');
      ln.split(/(_{3,})/).forEach(p=>{
        if(/^_{3,}$/.test(p))q.appendChild(field(base+'-'+(n++),p.length>=5?'w':p.length===4?'m':'s'));
        else if(p)q.appendChild(document.createTextNode(p));
      });
      b.appendChild(q);
    });
    if(n===0)b.appendChild(field(base,'full'));
    b.appendChild(mk('div','sol',e.sol[k]));
    li.appendChild(b);ol.appendChild(li);
  });
  // Check shows a solution only under items that have an answer: li.filled = at least one non-empty field
  const upd=li=>li.classList.toggle('filled',[...li.querySelectorAll('input')].some(i=>i.value.trim()));
  box.addEventListener('input',ev=>{const li=ev.target.closest('li');if(li)upd(li)});
  ol.querySelectorAll('li').forEach(upd);
  box.appendChild(ol);root.appendChild(box);
});
</script></body></html>
