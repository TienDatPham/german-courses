<h1>Passiv</h1>
<div class="sub">Grammatikübungen C1. „Check“ zeigt eine Lösung unter jeder Antwort. Die Lösungen sind selbst erstellt, nicht aus dem Buch. Bei offenen Aufgaben sind auch andere richtige Antworten möglich. Antworten werden im Browser gespeichert.</div>

<script>
const C={"id":"passiv","name":"Passiv","ex":[{"theory":["In der deutschen Grammatik kann man zwischen **Aktiv** und **Passiv** unterscheiden. Die meisten Sätze stehen im Aktiv. Oft geht dabei eine Aktion / Handlung oder ein Vorgang vom Subjekt aus.","> Der Administrator installiert das neue Programm. / Julia singt. / Ich fliege nach Kreta.","Man muss zwischen **Vorgangspassiv** und **Zustandspassiv** unterscheiden.","Das Vorgangspassiv beschreibt eine Aktion in Richtung Subjekt: z. B. Ihr Rucksack wurde gestohlen.","Das Zustandspassiv beschreibt einen Zustand des Subjekts: z. B. Die Fenster sind geputzt.","## 1. Vorgangspassiv","### 1.1. Vorgangspassiv mit Subjekt","Beim Vorgangspassiv geht eine Aktion etc. nicht vom Subjekt aus. Das Subjekt ist nicht der Täter.","> Der Raum wird vom Maler gestrichen. / Das Geld wurde gestohlen. / Es wird diskutiert.","Wenn man einen Aktivsatz mit Akkusativobjekt in ein Vorgangspassiv umwandelt, bildet man aus dem Akkusativobjekt das Subjekt des Passivsatzes und man bildet das Prädikat mit **werden** und **Partizip II**.","> Aktiv: Der Pilot steuert das Flugzeug.","> Passiv: Das Flugzeug wird vom Piloten gesteuert.","Mit von + Dat. gibt man in der Regel an, von wem die Aktion oder das Geschehen ausgeht (Urheber).","> Der Minister wurde vom Journalisten befragt.","Dieser Urheber muss nicht unbedingt eine Person, sondern kann auch eine Sache oder abstrakt sein.","> Der Bergwanderer wurden vom Regen überrascht.","Mit Präposition durch + Akk. kann man ein Mittel angeben. Man gebraucht es, wenn es keinen direkten Täter gibt, oder wenn der Täter im Auftrag handelt.","> Die Stadt wurde durch ein Erdbeben völlig zerstört. / Er wurde durch einen Kurier informiert.","**Die Zeiten im Vorgangspassiv**","|^Zeit|Subjekt|Position II|Ende","|Präsens|Die Vorschrift|wird|geändert.","|Präteritum|Die Vorschrift|wurde|geändert.","|Perfekt|Die Vorschrift|ist|geändert worden.¹","|Plusquamperfekt|Die Vorschrift|war|geändert worden.","|Futur I|Die Vorschrift|wird|geändert werden.","|Futur II|Die Vorschrift|wird|geändert worden sein.","~ 1) Partizip II von werden > geworden. Nur für das Passiv ist das Partizip II von werden > worden."]},{"t":"1.1 Vorgangspassiv · Übung 1","i":"Bilden Sie das Vorgangspassiv. Achten Sie auf die Zeit.","items":["Manche Ärzte empfehlen diese Impfungen.","Ich hatte den Kollegen bereits informiert.","Computer überwachen die Produktion.","Ihr habt dieses Projekt heftig kritisiert.","Der Beamte überprüfte den Inhalt des Kuverts.","Der Zeuge hat den Täter erkannt.","Dieses Gerät misst kleinste Veränderungen.","Paul kopierte alle wichtigen Dateien.","Wir hatten dieses Angebot abgelehnt.","Das Rote Kreuz verteilte die Hilfsgüter."],"sol":["Diese Impfungen werden von manchen Ärzten empfohlen.","Der Kollege war (von mir) bereits informiert worden.","Die Produktion wird von Computern überwacht.","Dieses Projekt ist von euch heftig kritisiert worden.","Der Inhalt des Kuverts wurde vom Beamten überprüft.","Der Täter ist vom Zeugen erkannt worden.","Kleinste Veränderungen werden von diesem Gerät gemessen.","Alle wichtigen Dateien wurden von Paul kopiert.","Dieses Angebot war (von uns) abgelehnt worden.","Die Hilfsgüter wurden vom Roten Kreuz verteilt."]},{"theory":["Das Indefinitpronomen **man** lässt sich im Vorgangspassiv mit der Präposition von und dem Indefinitpronomen [irgend]jemandem wiedergeben.","> Man hat den Mantel gereinigt. > Der Mantel ist von jemand[em] gereinigt worden.","In der Regel entfällt es aber.","> Der Mantel ist gereinigt worden.","Auch das Indefinitpronomen **niemand** kann man im Passiv wiedergeben.","> Niemand hatte ihn gewarnt. > Er war von niemand[em] gewarnt worden.","In der Regel entfällt auch niemand. Den Passivsatz muss man dann aber mit einer Negation bilden.","> Niemand hatte ihn gewarnt. > Er war nicht gewarnt worden.","> Leider fand niemand eine Lösung. > Leider wurde keine Lösung gefunden."]},{"t":"1.1 Vorgangspassiv · Übung 2","i":"Bilden Sie das Vorgangspassiv.","items":["Man verschob den Termin.","Man schliff die Messer.","Man vermied einen Konflikt.","Man verlor das Spiel.","Man schlug die Zelte auf.","Man schloss den Tresor.","Niemand entdeckte den Schatz.","Niemand fand den Fehler.","Niemand zwang dich.","Niemand las die Instruktionen.","Niemand unterschrieb den Vertrag.","Niemand wusch den Wagen."],"sol":["Der Termin wurde verschoben.","Die Messer wurden geschliffen.","Ein Konflikt wurde vermieden.","Das Spiel wurde verloren.","Die Zelte wurden aufgeschlagen.","Der Tresor wurde geschlossen.","Der Schatz wurde von niemandem entdeckt.","Der Fehler wurde von niemandem gefunden.","Du wurdest von niemandem gezwungen.","Die Instruktionen wurden von niemandem gelesen.","Der Vertrag wurde von niemandem unterschrieben.","Der Wagen wurde von niemandem gewaschen."]},{"t":"1.1 Vorgangspassiv · Übung 3","i":"Ergänzen Sie die Sätze. > Vorgangspassiv","items":["Man hat den Bericht bisher noch nicht bestätigt.\nDer Bericht ___ noch nicht ____.","Man erbat nähere Informationen über das Unglück.\nNähere Informationen _____.","Leider hatte man einige wichtige Details übersehen.\nLeider ___ einige wichtige Details ____.","Der Minister sagte eine schnelle Bearbeitung der Anträge zu.\nEine schnelle Bearbeitung der Anträge _____.","Das Unwetter verwüstete den gesamten Landstrich.\n___ gesamte Landstrich ____ Unwetter ____.","Mit einer Haaranalyse weist man den Konsum von Drogen nach.\n___ Konsum von Drogen ___ mit einer Haaranalyse ____.","Man hatte den Fall trotz vieler Proteste nicht weiter untersucht.\n___ Fall ___ trotz vieler Proteste nicht weiter ____."],"sol":["Der Bericht ist noch nicht bestätigt worden.","Nähere Informationen wurden erbeten.","Leider waren einige wichtige Details übersehen worden.","Eine schnelle Bearbeitung der Anträge wurde vom Minister zugesagt.","Der gesamte Landstrich wurde vom Unwetter verwüstet.","Der Konsum von Drogen wird mit einer Haaranalyse nachgewiesen.","Der Fall war trotz vieler Proteste nicht weiter untersucht worden."]},{"theory":["### 1.2. Vorgangspassiv ohne Subjekt","Enthält der Aktivsatz **kein** Akkusativobjekt, gebraucht man im Passiv das unpersönliche Subjekt **Es**. Meist setzt man ein anderes Satzglied an Position I; **Es** ist dann verborgen.","> Aktiv: Man diskutierte lange.","> Vorgangspassiv: Es wurde lange diskutiert. > Lange wurde diskutiert.","> Aktiv: Man half dem Verletzten.","> Vorgangspassiv: Es wurde dem Verletzten geholfen. > Dem Verletzten wurde geholfen.","> Aktiv: Man achtete auf die Qualität.","> Vorgangspassiv: Es wurde auf die Qualität geachtet. > Auf die Qualität wurde geachtet.","**Beispiel:**","|^Position I|Position II|Mittelfeld|Mittelfeld|Mittelfeld|Ende","|Es|wurde|bei der Konferenz|lange|über diese Themen|diskutiert.","|Bei der Konferenz|wurde||lange|über diese Themen|diskutiert.","|Lange|wurde|bei der Konferenz||über diese Themen|diskutiert.","|Über diese Themen|wurde|bei der Konferenz|lange||diskutiert.","Achtung: Auch wenn „Es“ versteckt ist, steht das Prädikat im Singular; „Es“ ist immer noch Subjekt."]},{"t":"1.2 Vorgangspassiv ohne Subjekt · Übung 4","i":"Bilden Sie das Vorgangspassiv im Präteritum.","items":["der Antragsteller - antworten","die Verletzten - helfen","der Zeuge - glauben","der Freund - verzeihen","der Artist - applaudieren","das Geburtstagskind - gratulieren","der Chirurg - assistieren","die Fachleute - misstrauen","die Opfer - beistehen","der Experte - widersprechen","der Kontrahent - drohen","die Bewerberin - absagen","die Musik - lauschen","die Frage - ausweichen","das Gesetz - zustimmen"],"bsp":"Beispiel: Kollege - danken → Dem Kollegen wurde gedankt.","sol":["Dem Antragsteller wurde geantwortet.","Den Verletzten wurde geholfen.","Dem Zeugen wurde geglaubt.","Dem Freund wurde verziehen.","Dem Artisten wurde applaudiert.","Dem Geburtstagskind wurde gratuliert.","Dem Chirurgen wurde assistiert.","Den Fachleuten wurde misstraut.","Den Opfern wurde beigestanden.","Dem Experten wurde widersprochen.","Dem Kontrahenten wurde gedroht.","Der Bewerberin wurde abgesagt.","Der Musik wurde gelauscht.","Der Frage wurde ausgewichen.","Dem Gesetz wurde zugestimmt."]},{"t":"1.2 Vorgangspassiv ohne Subjekt · Übung 5","i":"Bilden Sie das Vorgangspassiv im Präteritum.","items":["die Krise - diskutieren","die Verabredung - denken","Ruhe - bitten","der Scherz - lachen","die Politiker - schimpfen","Rettung - hoffen","die Aussage des Zeugen - zweifeln","diese Gefahr - warnen","diese Probleme - hinweisen","deine Ankunft - rechnen","die Pläne der Firmenleitung - protestieren","der Preis - verhandeln","diese Unhöflichkeit - reagieren","die Entscheidung - zögern","die Gesetze - verstoßen","die Bewirtung der Gäste - sorgen"],"bsp":"Beispiel: eine Alternative - suchen → Nach einer Alternative wurde gesucht.","sol":["Über die Krise wurde diskutiert.","An die Verabredung wurde gedacht.","Um Ruhe wurde gebeten.","Über den Scherz wurde gelacht.","Auf die Politiker wurde geschimpft.","Auf Rettung wurde gehofft.","An der Aussage des Zeugen wurde gezweifelt.","Vor dieser Gefahr wurde gewarnt.","Auf diese Probleme wurde hingewiesen.","Mit deiner Ankunft wurde gerechnet.","Gegen die Pläne der Firmenleitung wurde protestiert.","Über den Preis wurde verhandelt.","Auf diese Unhöflichkeit wurde reagiert.","Mit der Entscheidung wurde gezögert.","Gegen die Gesetze wurde verstoßen.","Für die Bewirtung der Gäste wurde gesorgt."]},{"theory":["### 1.3. Vorgangspassiv mit Modalverben","Wenn man im Passiv ein Modalverb gebraucht, steht das Modalverb - wie beim Aktiv - an Position II und am Ende ein Infinitiv Passiv (Partizip II + werden).","> Man muss alles genau überprüfen. > Alles muss genau überprüft werden.","> Man soll alles genau überprüfen. > Alles soll genau überprüft werden.","> Man kann alles genau überprüfen. > Alles kann genau überprüft werden.","> Man darf alles genau überprüfen. > Alles darf genau überprüft werden.","> Man will alles genau überprüfen. > Alles soll genau überprüft werden.","Im Aktiv wollen / möchten (eigener Wille) muss man im Passiv sinngemäß durch sollen (fremder Wille) ersetzen."]},{"t":"1.3 Vorgangspassiv mit Modalverben · Übung 6","i":"Bilden Sie Sätze im Vorgangspassiv.","items":["Jetzt muss man die Aufgabe endlich erledigen.","Zuerst muss man das Formular ausfüllen.","Natürlich durfte man die Informationen nicht weitergeben.","Leider konnte man den Fall nicht klären.","Selbstverständlich musste man die Schulden begleichen.","Anscheinend konnte man alle Fragen beantworten.","Vermutlich will man ein besseres Resultat erreichen.","Gestern wollte man das Wichtigste fertigstellen."],"bsp":"Beispiel: Leider konnte man nichts erreichen. → Leider konnte nichts erreicht werden.","sol":["Jetzt muss die Aufgabe endlich erledigt werden.","Zuerst muss das Formular ausgefüllt werden.","Natürlich durften die Informationen nicht weitergegeben werden.","Leider konnte der Fall nicht geklärt werden.","Selbstverständlich mussten die Schulden beglichen werden.","Anscheinend konnten alle Fragen beantwortet werden.","Vermutlich soll ein besseres Resultat erreicht werden. (wollen → sollen)","Gestern sollte das Wichtigste fertiggestellt werden. (wollen → sollen)"]},{"theory":["## 2. Zustandspassiv","Das Zustandspassiv oder Stativ bildet man mit den Formen von sein¹ und einem Partizip II².","> Das Projekt ist bereits abgeschlossen.","Meist verwendet man das Zustandspassiv nur im Präsens oder im Präteritum.","|Präsens|Die Patientin ist geheilt.","|Präteritum|Die Patientin war geheilt.","Man kann das Zustandspassiv auch in den übrigen Zeiten bilden, allerdings wird es sehr selten so verwendet.","|Perfekt|Die Patientin ist geheilt gewesen.","|Plusquamperf.|Die Patientin war geheilt gewesen.","|Futur I|Die Patientin wird geheilt sein.","|Futur II³|Die Patientin wird geheilt gewesen sein.","Wie der Name Zustandspassiv bereits sagt, lassen sich damit Zustände beschreiben.","> Das Brot ist gebacken. / Die Schuhe sind geputzt. / Das Rätsel war gelöst.","Häufig wird das Zustandspassiv als Resultat einer vorausgegangenen Handlung gesehen.","> Man hat das Haus renoviert. > Zustandspassiv: Das Haus ist nun renoviert.","> Man hatte die Fenster geputzt. > Zustandspassiv: Die Fenster waren dann geputzt.","~ 1) Unterscheiden muss man das Zustandspassiv vom Perfekt/Plusquamperfekt mit sein: Max ist verreist. / Das Kind war eingeschlafen.","~ 2) Handelt es sich um das Partizip II eines reflexiven Verbs, spricht man von einem Zustandsreflexiv: sich betrinken > Er ist betrunken.","~ 3) Das Zustandspassiv im Futur II wird so gut wie nie gebraucht."]},{"t":"2 Zustandspassiv · Übung 7","i":"Bilden Sie Sätze im Zustandspassiv.","items":["die Waren - sortieren","die Geschenke - einpacken","das Programm - installieren","die Gruppe - benachrichtigen","die Flüge - buchen","die Werkstatt - aufräumen","die E-Mail - weiterleiten","das Formular - ausfüllen","das Geld - überweisen","die Fenster - öffnen"],"bsp":"Beispiel: die Schuhe - putzen → Putz bitte die Schuhe! - Die sind schon längst geputzt.","sol":["Sortier bitte die Waren! – Die sind schon längst sortiert.","Pack bitte die Geschenke ein! – Die sind schon längst eingepackt.","Installier bitte das Programm! – Das ist schon längst installiert.","Benachrichtige bitte die Gruppe! – Die ist schon längst benachrichtigt.","Buch bitte die Flüge! – Die sind schon längst gebucht.","Räum bitte die Werkstatt auf! – Die ist schon längst aufgeräumt.","Leite bitte die E-Mail weiter! – Die ist schon längst weitergeleitet.","Füll bitte das Formular aus! – Das ist schon längst ausgefüllt.","Überweis bitte das Geld! – Das ist schon längst überwiesen.","Öffne bitte die Fenster! – Die sind schon längst geöffnet."]},{"theory":["In den meisten Fällen bildet man das Zustandspassiv von Verben mit Akkusativobjekt (transitive Verben). Dabei kann in der Regel die Handlung, die dem Zustandspassiv im Präsens oder Präteritum vorausgeht, durch einen Satz im Vorgangspassiv im Präteritum / Perfekt bzw. im Plusquamperfekt wiedergeben.","> Das Brot ist gebacken. > Vorgangspassiv: Das Brot wurde gebacken. / Das Brot ist gebacken worden.","> Der Raum war renoviert. > Vorgangspassiv: Der Raum war renoviert worden."]},{"t":"2 Zustandspassiv · Übung 8","i":"Bilden Sie Sätze im Vorgangspassiv (Plusquamperfekt) und im Zustandspassiv.","items":["den Fehler korrigieren","den Vertrag unterzeichnen","die Hemden bügeln","den Pin-Code ändern","die Buchung bestätigen","das Konto sperren","den Ausgang schließen","den Akku aufladen","die Vase zerbrechen","das Fleisch räuchern","den Pfeffer mahlen","die Häuser modernisieren","den Patienten heilen","die Leute schockieren","das Gerät reinigen","den Streit schlichten","den Draht biegen","die Entscheidung treffen"],"bsp":"Beispiel: den Auftrag erledigen → Der Auftrag war erledigt worden, dann war er erledigt.","sol":["Der Fehler war korrigiert worden, dann war er korrigiert.","Der Vertrag war unterzeichnet worden, dann war er unterzeichnet.","Die Hemden waren gebügelt worden, dann waren sie gebügelt.","Der Pin-Code war geändert worden, dann war er geändert.","Die Buchung war bestätigt worden, dann war sie bestätigt.","Das Konto war gesperrt worden, dann war es gesperrt.","Der Ausgang war geschlossen worden, dann war er geschlossen.","Der Akku war aufgeladen worden, dann war er aufgeladen.","Die Vase war zerbrochen worden, dann war sie zerbrochen.","Das Fleisch war geräuchert worden, dann war es geräuchert.","Der Pfeffer war gemahlen worden, dann war er gemahlen.","Die Häuser waren modernisiert worden, dann waren sie modernisiert.","Der Patient war geheilt worden, dann war er geheilt.","Die Leute waren schockiert worden, dann waren sie schockiert.","Das Gerät war gereinigt worden, dann war es gereinigt.","Der Streit war geschlichtet worden, dann war er geschlichtet.","Der Draht war gebogen worden, dann war er gebogen.","Die Entscheidung war getroffen worden, dann war sie getroffen."]},{"theory":["Nicht immer beschreibt das Zustandspassiv das Resultat einer vorangegangenen Aktion, denn z. T. lässt sich kein entsprechendes Vorgangspassiv bilden.","> Das Haus ist seit einiger Zeit wieder bewohnt.","> Unsere Möglichkeiten sind begrenzt.","Im Zustandspassiv wird der Urheber häufig nicht genannt, kann aber mit von / durch angegeben werden.","> Die Grundlage für eine Veränderung ist nun von der Regierung geschaffen.","> Der vergangene Monat war durch schlimme Unwetter gekennzeichnet."]},{"t":"2 Zustandspassiv · Übung 9","i":"Formulieren Sie die Aussagen im Zustandspassiv.","items":["Ein Fluss trennt die beiden Stadtteile.","Die Verfassung schützt die Pressefreiheit.","Das Gesetz regelt den Waffenbesitz.","Die Kostenexplosion gefährdet das Projekt.","Das Zirpen der Insekten durchdringt die Nacht.","Der Nebel hat die Berggipfel verhüllt.","Der Regen hat die Wege aufgeweicht.","Das Unwetter hat das Land verwüstet.","Die lange Trockenheit hat die Bäume geschädigt.","Die Leistung des Teams hat die Fans enttäuscht."],"bsp":"Beispiel: Schnee bedeckt die Felder → Die Felder sind von Schnee bedeckt.","sol":["Die beiden Stadtteile sind durch einen Fluss getrennt.","Die Pressefreiheit ist durch die Verfassung geschützt.","Der Waffenbesitz ist durch das Gesetz geregelt.","Das Projekt ist durch die Kostenexplosion gefährdet.","Die Nacht ist vom Zirpen der Insekten durchdrungen.","Die Berggipfel sind vom Nebel verhüllt.","Die Wege sind vom Regen aufgeweicht.","Das Land ist vom Unwetter verwüstet.","Die Bäume sind von der langen Trockenheit geschädigt.","Die Fans sind von der Leistung des Teams enttäuscht."]},{"theory":["## 3. Passiversatzformen","Man kann im Deutschen nicht nur mit dem Vorgangspassiv ein passives Geschehen ausdrücken.","### bekommen/erhalten/kriegen + Partizip II > jemandem wird etwas gegeben/geschenkt etc.","> Sie erhielt/bekam/kriegte einen Gutschein geschenkt.","> Passiv: Ein Gutschein wurde ihr geschenkt. > Aktiv: Man schenkte ihr einen Gutschein.","Diese Passiversatzform wird auch als **Adressatenpassiv** bezeichnet. Man kann es nur von Verben bilden, die ein Dativ- und ein Akkusativobjekt haben. (z. B. schenken, zeigen, überreichen, sagen)","> Man schenkt dir einen Gutschein.","Im Adressatenpassiv wird das Dativobjekt zum Subjekt, das Akkusativobjekt bleibt Akkusativobjekt.","> Du bekommst einen Gutschein geschenkt.","Der Täter kann genannt werden.","> Du bekommst von mir einen Gutschein geschenkt."]},{"t":"3 Passiversatzformen · Übung 10","i":"","items":["Wir bekamen den Schrank geliefert.","Ich bekam den Betrag auf das Konto überwiesen.","Ihr habt ein falsches Datum genannt bekommen.","Alle Teilnehmer erhalten die Unterlagen zugesandt.","Der Patient kriegte das Essen ans Bett gebracht."],"bsp":"Beispiel: Ich kriegte die Kosten erstattet. → Man erstattete mir die Kosten.","sol":["Man lieferte uns den Schrank.","Man überwies mir den Betrag auf das Konto.","Man hat euch ein falsches Datum genannt.","Man sendet allen Teilnehmern die Unterlagen zu.","Man brachte dem Patienten das Essen ans Bett."]},{"theory":["### sein + Infinitiv mit zu > etwas kann, soll, sollte, muss gemacht werden / darf nicht gemacht werden","> Die Vorschriften sind zu beachten.","> Passiv: Die Vorschriften müssen beachtet werden. > Aktiv: Man muss die Vorschriften beachten.","> Das Produkt ist billig herzustellen.","> Passiv: Das Produkt kann billig hergestellt werden. > Aktiv: Man kann das Produkt billig herstellen.","> Die Gefahr ist nicht zu unterschätzen.","> Passiv: Die Gefahr darf nicht unterschätzt werden. > Aktiv: Man darf die Gefahr nicht unterschätzen.","Die Passiversatzform mit sein + zu + Infinitiv kann eine Möglichkeit, eine Forderung, eine Empfehlung oder eine Notwendigkeit ausdrücken. Der Täter wird in der Regel nicht genannt."]},{"t":"3 Passiversatzformen · Übung 11","i":"Bilden Sie Sätze im Aktiv.","items":["Die Instruktionen sind genau zu befolgen.","Die Mängel waren leider nicht zu beheben.","Der Hinterausgang ist nur im Notfall zu benutzen.","Verträge sind einzuhalten.","Auf dem Foto war nicht alles zu erkennen."],"bsp":"Beispiel: Der Raum ist immer abzuschließen. → Man muss den Raum immer abschließen.","sol":["Man muss die Instruktionen genau befolgen.","Man konnte die Mängel leider nicht beheben.","Man darf den Hinterausgang nur im Notfall benutzen.","Man muss Verträge einhalten.","Man konnte auf dem Foto nicht alles erkennen."]},{"theory":["### sich (Akk.) lassen + Infinitiv > etwas kann gemacht werden","> Die Tür lässt sich nicht abschließen.","> Passiv: Die Tür kann nicht abgeschlossen werden. > Aktiv: Man kann die Tür nicht abschließen.","Die Passiversatzform mit lassen + Infinitiv drückt aus, dass die Möglichkeit einer Handlung oder eines Geschehens an der Sache selbst und nicht am Urheber liegt. Der Täter kann nicht genannt werden."]},{"t":"3 Passiversatzformen · Übung 12","i":"Bilden Sie Sätze im Aktiv.","items":["Exakte Prognosen lassen sich nicht erstellen.","Der Schrank ließ sich nicht zerlegen.","Das Material lässt sich einigermaßen gut verarbeiten.","Diese Idee ließ sich nicht umsetzen.","Dieser Termin lässt sich nicht kurzfristig verschieben.","Dieser Prozess ließe sich mit Sicherheit vereinfachen."],"bsp":"Beispiel: Diese Zahl lässt sich durch drei teilen. → Man kann diese Zahl durch drei teilen.","sol":["Man kann exakte Prognosen nicht erstellen.","Man konnte den Schrank nicht zerlegen.","Man kann das Material einigermaßen gut verarbeiten.","Man konnte diese Idee nicht umsetzen.","Man kann diesen Termin nicht kurzfristig verschieben.","Man könnte diesen Prozess mit Sicherheit vereinfachen."]},{"theory":["### gehören + Partizip II > etwas muss / (sollte unbedingt) gemacht werden","> Das Zimmer gehört gestrichen.","> Passiv: Das Zimmer muss gestrichen werden. > Aktiv: Man muss das Zimmer streichen.","### bleiben + Infinitiv + zu > etwas muss / sollte gemacht werden","> Einiges bleibt noch zu erledigen.","> Passiv: Einiges muss noch erledigt werden. > Aktiv: Man muss noch einiges erledigen.","### es heißt / es gilt + Infinitiv + zu > etwas muss / sollte gemacht werden","> Diese Tiere gilt es / heißt es zu schützen.","> Passiv: Diese Tiere müssen/sollten geschützt werden. > Aktiv: Man muss / sollte diese Tiere schützen.","Die Passiversatzformen mit gehören + Partizip II, bleiben/es gilt/ es heißt + Infinitiv + zu können eine Notwendigkeit oder eine Empfehlung ausdrücken. Der Täter wird nicht genannt."]},{"t":"3 Passiversatzformen · Übung 13","i":"Bilden Sie Sätze im Aktiv.","items":["Die Daten gilt es richtig zu interpretieren.","Alle Fenster im Erdgeschoss gehören erneuert.","Die weitere Entwicklung bleibt abzuwarten.","In die Eingangshalle gehört ein Feuerlöscher gehängt.","Alle Teile des Gerätes gehören nummeriert.","Die erfolgreiche Arbeit heißt es jetzt fortzusetzen."],"bsp":"Beispiel: Die Ergebnisse gehören überprüft. → Man muss die Ergebnisse unbedingt überprüfen.","sol":["Man muss die Daten richtig interpretieren.","Man muss alle Fenster im Erdgeschoss erneuern.","Man muss die weitere Entwicklung abwarten.","Man muss in der Eingangshalle einen Feuerlöscher aufhängen.","Man muss alle Teile des Gerätes nummerieren.","Man muss die erfolgreiche Arbeit jetzt fortsetzen."]}]};

const root=document.getElementById('root');
let store={};const KEY="grammatik-c1-antworten";
try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
function field(id,cls){
  const i=mk('input','f '+cls);i.type='text';i.autocomplete='off';i.spellcheck=false;
  i.value=store[id]||'';
  i.oninput=()=>{if(i.value)store[id]=i.value;else delete store[id];save()};
  return i;
}
const rich=(el,t)=>t.split(/(\*\*[^*]+\*\*)/).forEach(p=>{if(/^\*\*[^*]+\*\*$/.test(p))el.appendChild(mk('b',null,p.slice(2,-2)));else if(p)el.appendChild(document.createTextNode(p))});
function theory(lines){
  const box=mk('section','theory');let tb=null;
  lines.forEach(l=>{
    if(l[0]==='|'){
      if(!tb){const w=mk('div','tbw');tb=mk('table');w.appendChild(tb);box.appendChild(w)}
      const h=l[1]==='^';const tr=mk('tr');
      l.slice(h?2:1).split('|').forEach(c=>{const td=mk(h?'th':'td');c.split('¶').forEach((p,i)=>{if(i)td.appendChild(mk('br'));rich(td,p.trim())});tr.appendChild(td)});
      tb.appendChild(tr);return;
    }
    tb=null;
    let el;
    if(l.startsWith('## ')){el=mk('h2');rich(el,l.slice(3))}
    else if(l.startsWith('### ')){el=mk('h3');rich(el,l.slice(4))}
    else if(l.startsWith('> ')){el=mk('div','eg');rich(el,l.slice(2))}
    else if(l.startsWith('~ ')){el=mk('div','note');rich(el,l.slice(2))}
    else if(l.startsWith('- ')){el=mk('div','li');rich(el,l)}
    else{el=mk('p');rich(el,l)}
    box.appendChild(el);
  });
  root.appendChild(box);
}
let xi=0;
C.ex.forEach(e=>{
  if(e.theory){theory(e.theory);return}
  const ei=xi++;
  const box=mk('section','ex');
  const head=mk('div','head');head.appendChild(mk('h3',null,e.t));
  const btn=mk('button','chk','Check');btn.type='button';
  btn.onclick=()=>{const on=box.classList.toggle('show');btn.textContent=on?'Verbergen':'Check'};
  const rst=mk('button','chk','Reset');rst.type='button';
  // Reset clears every field of this exercise (and its saved answers) via the normal input handlers
  rst.onclick=()=>box.querySelectorAll('input.f').forEach(i=>{if(i.value){i.value='';i.dispatchEvent(new Event('input',{bubbles:true}))}});
  const btns=mk('div','btns');btns.appendChild(btn);btns.appendChild(rst);
  head.appendChild(btns);box.appendChild(head);
  if(e.i)box.appendChild(mk('p','instr',e.i));
  if(e.hint)box.appendChild(mk('p','hint',e.hint));
  if(e.bank)box.appendChild(mk('div','bank',e.bank));
  if(e.bsp)box.appendChild(mk('div','bsp',e.bsp));
  const ol=mk('ol');
  e.items.forEach((it,k)=>{
    const li=mk('li');
    li.appendChild(mk('span','l',String.fromCharCode(97+k%26)+')'));
    const b=mk('div','body');
    const base=C.id+'-'+ei+'-'+k;
    let n=0;
    it.split('\n').forEach(ln=>{
      const q=mk('div','q');
      ln.split(/(_{3,})/).forEach(p=>{
        if(/^_{3,}$/.test(p))q.appendChild(field(base+'-'+(n++),p.length>=5?'w':p.length===4?'m':'s'));
        else if(p)q.appendChild(document.createTextNode(p));
      });
      b.appendChild(q);
    });
    if(n===0)b.appendChild(field(base,'full'));
    b.appendChild(mk('div','sol',e.sol[k]));
    li.appendChild(b);ol.appendChild(li);
  });
  // Check shows a solution only under items that have an answer: li.filled = at least one non-empty field
  const upd=li=>li.classList.toggle('filled',[...li.querySelectorAll('input')].some(i=>i.value.trim()));
  box.addEventListener('input',ev=>{const li=ev.target.closest('li');if(li)upd(li)});
  ol.querySelectorAll('li').forEach(upd);
  box.appendChild(ol);root.appendChild(box);
});
</script></body></html>
