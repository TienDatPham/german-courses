const root=document.getElementById('root'),nav=document.getElementById('nav');
let store={};const KEY='grammatik-c1-antworten';
try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};
const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
function field(id,cls){
  const i=mk('input','f '+cls);i.type='text';i.autocomplete='off';i.spellcheck=false;i.dataset.id=id;
  i.value=store[id]||'';
  i.oninput=()=>{if(i.value)store[id]=i.value;else delete store[id];save();count()};
  return i;
}
let total=0;
CH.forEach((c,ci)=>{
  const a=mk('a',null,c.name);a.href='#'+c.id;nav.appendChild(a);
  const h=mk('h2',null,c.name);h.id=c.id;root.appendChild(h);
  c.ex.forEach((e,ei)=>{
    const box=mk('section','ex');
    box.appendChild(mk('h3',null,e.t));
    if(e.i)box.appendChild(mk('p','instr',e.i));
    if(e.hint)box.appendChild(mk('p','hint',e.hint));
    if(e.bank)box.appendChild(mk('div','bank',e.bank));
    if(e.bsp)box.appendChild(mk('div','bsp',e.bsp));
    const ol=mk('ol');
    e.items.forEach((it,k)=>{
      const li=mk('li');
      li.appendChild(mk('span','l',String.fromCharCode(97+k%26)+')'));
      const b=mk('div','body');
      const base=c.id+'-'+ei+'-'+k;
      const lines=it.split('\n');
      let n=0;
      lines.forEach((ln,li2)=>{
        const q=mk('div','q');
        const parts=ln.split(/(_{3,})/);
        const hasBlank=parts.length>1;
        parts.forEach(p=>{
          if(/^_{3,}$/.test(p)){q.appendChild(field(base+'-'+(n++),p.length>=5?'w':p.length===4?'m':'s'))}
          else if(p)q.appendChild(document.createTextNode(p));
        });
        b.appendChild(q);
      });
      if(n===0)b.appendChild(field(base,'full'));
      total++;
      li.appendChild(b);ol.appendChild(li);
    });
    box.appendChild(ol);root.appendChild(box);
  });
});
count();
